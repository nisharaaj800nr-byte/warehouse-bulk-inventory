/* ────────────────────────── SCREEN: MULTI-SOURCE IMPORT ────────────────────────── */
function screenMultiSource(el) {
  const TYPES = ['QC_STOCK', 'TRC', 'INVENTORY', 'LOCATION', 'OTHER'];
  const st = {
    sources: [{ type: 'QC_STOCK', name: 'QC Stock', sheetName: 'QC Stock' }],
    types: TYPES.slice(),
    jobId: '',
    result: null,
    conflicts: null,
    history: null,
    validating: false,
    importing: false,
    progress: null
  };

  const typeOptions = cur => st.types.map(t =>
    `<option value="${esc(t)}"${t === cur ? ' selected' : ''}>${esc(t)}</option>`).join('');

  const render = () => {
    const srcRows = st.sources.map((s, i) => `
      <div class="src-row" data-i="${i}">
        <span class="src-idx">${i + 1}</span>
        <select class="ms-type" data-i="${i}" aria-label="Source type">${typeOptions(s.type)}</select>
        <input class="ms-name" data-i="${i}" placeholder="Source name (e.g. QC Stock)" value="${esc(s.name)}">
        <input class="ms-sheet" data-i="${i}" placeholder="Sheet name / auto-set from file" value="${esc(s.sheetName)}">
        <input type="file" class="ms-file" data-i="${i}" accept=".csv,.txt,.tsv,.xls,.xlsx,.pdf" multiple hidden>
        <button class="btn ms-browse" data-i="${i}" title="Browse a file">📁 Browse</button>
        <span class="ms-status" data-i="${i}">${esc(s._status || '')}</span>
        <button class="btn danger ms-remove" data-i="${i}" title="Remove source">✕</button>
      </div>`).join('');

    const progress = st.progress ? `
      <div class="ms-progress">
        <div class="ms-progress-bar"><div class="ms-progress-fill" style="width:${esc(String(st.progress.progress ?? 0))}%"></div></div>
        <div class="ms-progress-meta">
          <span><strong>${esc(st.progress.status || '')}</strong> · ${esc(st.progress.currentSource || '')}</span>
          <span>${fmt(st.progress.totalRows || 0)} rows</span>
        </div>
      </div>` : '';

    const result = st.result ? `
      <div class="ms-result">
        <div class="ms-stat"><strong>${fmt(st.result.totalRows || 0)}</strong><span>Total rows</span></div>
        <div class="ms-stat"><strong>${fmt(st.result.devices || 0)}</strong><span>Devices built</span></div>
        <div class="ms-stat"><strong>${fmt(st.result.conflicts || 0)}</strong><span>Conflicts</span></div>
        <div class="ms-stat"><strong>${esc(st.result.status || '')}</strong><span>Status</span></div>
      </div>
      ${(st.result.failedSources && st.result.failedSources.length) ? `<div class="err-strip">⚠️ Failed sources: ${esc(st.result.failedSources.map(f => f.source + ' (' + f.error + ')').join('; '))}</div>` : ''}` : '';

    const conflictRows = (st.conflicts && st.conflicts.rows && st.conflicts.rows.length) ? st.conflicts.rows.map(r => `
      <tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])} = ${esc(r[3])}</td><td>${esc(r[4])} = ${esc(r[5])}</td><td class="win">${esc(r[6])}</td></tr>`).join('') : '<tr><td colspan="5" class="muted">No conflicts logged yet.</td></tr>';

    const historyRows = (st.history && st.history.data && st.history.data.length) ? st.history.data.slice(0, 12).map(r => `
      <tr><td>${esc(r[0])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td>${fmt(r[5])}</td><td>${esc(r[9])}</td></tr>`).join('') : '<tr><td colspan="6" class="muted">No import history yet.</td></tr>';

    el.innerHTML = `
      <div class="screen-head"><h2>🧩 Multi-Source Import</h2>
      <p class="hint">Select multiple sources (QC Stock, TRC, Inventory, Location, Other) in one import. Each source is classified, consolidated into SOURCE_DATA with its identity preserved, then joined into one logical device record per barcode.</p></div>

      <div class="card">
        <div class="card-head"><h3>Selected Sources (${st.sources.length})</h3><div class="btn-row" style="margin:0"><button class="btn" id="msAddFiles">📁 Add Files</button><button class="btn" id="msAdd">＋ Add Source</button></div></div>
        <input type="file" id="msAddFilesInput" multiple accept=".csv,.txt,.tsv,.xls,.xlsx,.pdf" hidden>
        <div class="ms-sources">${srcRows || '<div class="muted">No sources. Click “Add Source”.</div>'}</div>
        <div class="card-foot">
          <button class="btn" id="msValidate" ${st.validating || st.importing ? 'disabled' : ''}>✔ Validate All</button>
          <button class="btn primary" id="msImport" ${st.importing ? 'disabled' : ''}>▶ Import All</button>
          <span class="muted" style="margin-left:auto">${api.mode() === 'demo' ? 'Demo mode — connect backend to run' : api.mode() === 'native' ? 'Google native' : 'Connected'}</span>
        </div>
      </div>

      <div class="card"><div class="card-head"><h3>Job Progress</h3></div>${progress || '<div class="muted">No job started.</div>'}</div>
      <div class="card"><div class="card-head"><h3>Result</h3></div>${result || '<div class="muted">Run “Import All” to see results.</div>'}</div>

      <div class="card"><div class="card-head"><h3>Field Conflicts</h3><button class="btn" id="msClearConf">Clear</button></div>
        <div class="tbl-wrap"><table><thead><tr><th>Barcode</th><th>Field</th><th>Source A</th><th>Source B</th><th>Final</th></tr></thead><tbody>${conflictRows}</tbody></table></div></div>

      <div class="card"><div class="card-head"><h3>Source Import History</h3></div>
        <div class="tbl-wrap"><table><thead><tr><th>Run</th><th>Type</th><th>Source</th><th>Sheet</th><th>Rows</th><th>Status</th></tr></thead><tbody>${historyRows}</tbody></table></div></div>
    `;
    bind();
  };

  const readSources = () => st.sources.map((s, i) => ({
    type: $('.ms-type[data-i="' + i + '"]') ? $('.ms-type[data-i="' + i + '"]').value : s.type,
    name: ($('.ms-name[data-i="' + i + '"]') || {}).value || s.name,
    sheetName: ($('.ms-sheet[data-i="' + i + '"]') || {}).value || ''
  })).filter(s => s.name && s.sheetName);

  const fileToB64 = f => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(new Error('Could not read the file.'));
    r.readAsDataURL(f);
  });

  const sanitizeSheetName = (n) => String(n || '').replace(/[^a-zA-Z0-9_ ]/g, '_').slice(0, 40);

  const uploadFileToSource = async (i, file) => {
    if (!file) return;
    if (api.mode() === 'demo') { toast('Demo mode — connect the backend to upload files.', 'warn'); return; }
    const src = st.sources[i];
    const stEl = $('.ms-status[data-i="' + i + '"]');
    if (stEl) stEl.textContent = 'Uploading…';
    try {
      const b64 = await fileToB64(file);
      const sheetName = (src.name ? src.name : file.name.replace(/\.[^.]+$/, '')).replace(/[^a-zA-Z0-9_ ]/g, '_').slice(0, 40);
      const r = await api.call('import.fileToSource', { b64, fileName: file.name, sheetName });
      src.sheetName = r.sheetName;
      src._status = '✓ ' + r.totalRows + ' rows';
      const nameEl = $('.ms-name[data-i="' + i + '"]');
      const sheetEl = $('.ms-sheet[data-i="' + i + '"]');
      if (nameEl && !nameEl.value && file.name) nameEl.value = file.name.replace(/\.[^.]+$/, '');
      if (sheetEl) sheetEl.value = r.sheetName;
      src._sheetEdited = true;   // file-derived sheet name wins over name auto-fill
      if (stEl) stEl.textContent = src._status;
      toast('"' + file.name + '" staged as sheet "' + r.sheetName + '" (' + r.totalRows + ' rows).', 'ok');
    } catch (e) {
      src._status = '✗ ' + e.message;
      if (stEl) stEl.textContent = src._status;
      toast(e.message, 'err');
    }
  };

  const addMultipleFiles = async (files) => {
    if (!files || !files.length) return;
    if (api.mode() === 'demo') { toast('Demo mode — connect the backend to upload files.', 'warn'); return; }
    const startIdx = st.sources.length;
    files.forEach((f) => {
      st.sources.push({ type: 'OTHER', name: f.name.replace(/\.[^.]+$/, ''), sheetName: '', _status: 'Queued…' });
    });
    render();
    for (let k = 0; k < files.length; k++) {
      await uploadFileToSource(startIdx + k, files[k]);
    }
    render();
  };

  const handleSourceFileSelect = async (i, files) => {
    if (!files || !files.length) return;
    // First file fills the current source; extra files become new sources.
    await uploadFileToSource(i, files[0]);
    for (let k = 1; k < files.length; k++) {
      const idx = st.sources.length;
      st.sources.push({ type: 'OTHER', name: files[k].name.replace(/\.[^.]+$/, ''), sheetName: '', _status: 'Queued…' });
      render();
      await uploadFileToSource(idx, files[k]);
    }
    render();
  };

  const validateAll = async () => {
    const sources = readSources();
    if (!sources.length) { toast('Add at least one source with a sheet name.', 'warn'); return; }
    if (api.mode() === 'demo') { toast('Demo mode — connect the Apps Script backend to validate real sources.', 'warn'); return; }
    st.validating = true; render();
    try {
      const v = await api.call('import.multiSource.validate', { sources });
      toast('Validated: ' + v.length + ' source(s) ready.', 'ok');
    } catch (e) { toast(e.message, 'err'); }
    st.validating = false; render();
  };

  const importAll = async () => {
    const sources = readSources();
    if (!sources.length) { toast('Add at least one source with a sheet name.', 'warn'); return; }
    if (api.mode() === 'demo') { toast('Demo mode — connect the Apps Script backend to run the multi-source import.', 'warn'); return; }
    st.importing = true; st.result = null; st.progress = { status: 'Creating job…', progress: 2, currentSource: '', totalRows: 0 }; render();
    try {
      const created = await api.call('import.multiSource.create', { sources });
      st.jobId = created.jobId;
      st.progress = { status: 'Importing…', progress: 15, currentSource: 'Consolidating', totalRows: 0 }; render();
      const result = await api.call('import.multiSource.run', { jobId: created.jobId });
      st.result = result;
      st.progress = { status: result.status, progress: 100, currentSource: '', totalRows: result.totalRows };
      try { st.conflicts = await api.call('conflicts.list', { limit: 100 }); } catch (e) {}
      try { st.history = await api.call('sourceData.history'); } catch (e) {}
      toast('Import ' + (result.status === 'COMPLETE' ? 'complete' : 'finished with partial failure') + ' — ' + fmt(result.devices) + ' devices.', result.status === 'COMPLETE' ? 'ok' : 'warn');
    } catch (e) { toast(e.message, 'err'); st.progress = { status: 'FAILED', progress: 0, currentSource: '', totalRows: 0 }; }
    st.importing = false; render();
  };

  const bind = () => {
    const add = $('#msAdd'); if (add) add.onclick = () => { st.sources.push({ type: 'OTHER', name: '', sheetName: '' }); render(); };
    const addFiles = $('#msAddFiles'); if (addFiles) addFiles.onclick = () => { const fi = $('#msAddFilesInput'); if (fi) fi.click(); };
    const addFilesInput = $('#msAddFilesInput'); if (addFilesInput) addFilesInput.onchange = () => addMultipleFiles(Array.from(addFilesInput.files || []));
    const val = $('#msValidate'); if (val) val.onclick = validateAll;
    const imp = $('#msImport'); if (imp) imp.onclick = importAll;
    const clr = $('#msClearConf'); if (clr) clr.onclick = async () => { if (api.mode() === 'demo') { toast('Demo mode.', 'warn'); return; } try { await api.call('conflicts.clear'); st.conflicts = { rows: [], headers: ['BARCODE', 'FIELD', 'SOURCE_1', 'VALUE_1', 'SOURCE_2', 'VALUE_2', 'FINAL_VALUE', 'RULE_USED', 'IMPORT_RUN_ID', 'TIMESTAMP'], total: 0 }; toast('Conflicts cleared.', 'ok'); } catch (e) { toast(e.message, 'err'); } render(); };
    $$('.ms-remove').forEach(b => { b.onclick = () => { st.sources.splice(Number(b.dataset.i), 1); render(); }; });
    $$('.ms-type').forEach(s => { s.onchange = () => { const i = Number(s.dataset.i); if (st.sources[i]) st.sources[i].type = s.value; }; });
    // Auto-fill the sheet name from the source name as the user types (until manually edited).
    $$('.ms-name').forEach(inp => {
      inp.oninput = () => {
        const i = Number(inp.dataset.i);
        const src = st.sources[i];
        if (!src || src._sheetEdited) return;
        const sheetEl = $('.ms-sheet[data-i="' + i + '"]');
        if (sheetEl) sheetEl.value = sanitizeSheetName(inp.value);
      };
    });
    $$('.ms-sheet').forEach(inp => {
      inp.oninput = () => { const i = Number(inp.dataset.i); if (st.sources[i]) st.sources[i]._sheetEdited = true; };
    });
    $$('.ms-browse').forEach(b => { b.onclick = () => { const fi = $('.ms-file[data-i="' + b.dataset.i + '"]'); if (fi) fi.click(); }; });
    $$('.ms-file').forEach(fi => { fi.onchange = () => handleSourceFileSelect(Number(fi.dataset.i), Array.from(fi.files || [])); });
  };

  // Load source types + existing conflicts/history when live
  if (api.isLive()) {
    api.call('sources.types').then(t => { if (Array.isArray(t) && t.length) st.types = t; render(); }).catch(() => {});
    api.call('conflicts.list', { limit: 100 }).then(c => { st.conflicts = c; render(); }).catch(() => {});
    api.call('sourceData.history').then(h => { st.history = h; render(); }).catch(() => {});
  }

  // Files queued from the single-file Import screen (multi-select) → add as sources + upload
  if (msQueue && msQueue.length) {
    const files = msQueue.slice(); msQueue = [];
    st.sources = files.map(f => ({ type: 'OTHER', name: f.name.replace(/\.[^.]+$/, ''), sheetName: '', _status: 'Queued…' }));
    render();
    (async () => { for (let k = 0; k < files.length; k++) await uploadFileToSource(k, files[k]); render(); })();
  }

  render();
}

/* ────────────────────────── THEME ────────────────────────── */
const THEME_KEY = 'ias_theme';
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = $('#themeBtn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
}
function initTheme() {
  let theme = 'light';
  try { theme = localStorage.getItem(THEME_KEY) || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
  applyTheme(theme);
}

/* ────────────────────────── BOOT ────────────────────────── */
function boot() {
  initTheme();
  window.addEventListener('hashchange', render);
  // Mobile: sidebar backdrop + auto-close on navigation
  const sb = $('#sidebar');
  let back = $('#sideBackdrop');
  if (!back) { back = document.createElement('div'); back.id = 'sideBackdrop'; document.body.appendChild(back); }
  const closeSide = () => { sb.classList.remove('open'); back.classList.remove('show'); };
  $('#menuBtn').onclick = () => { const open = sb.classList.toggle('open'); back.classList.toggle('show', open); };
  back.onclick = closeSide;
  window.addEventListener('hashchange', closeSide);
  $('#themeBtn').onclick = () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  const langBtn = $('#langBtn');
  const applyLang = () => {
    state.lang = state.lang === 'hi' ? 'en' : 'hi';
    save();
    if (langBtn) langBtn.textContent = state.lang === 'hi' ? 'EN' : 'हिंदी';
    render();
  };
  if (langBtn) { langBtn.textContent = state.lang === 'hi' ? 'EN' : 'हिंदी'; langBtn.onclick = applyLang; }
  $('#runBtn').onclick = () => runPipelineUI();
  setInterval(() => { const d = new Date(); $('#clock').textContent = d.toLocaleString('en-IN'); }, 30000);
  $('#clock').textContent = new Date().toLocaleString('en-IN');
  if (api.isLive()) {
    // Load real backend data first, then render
    $('#content').innerHTML = `<div class="card"><h2>Connecting to backend…</h2><div class="progress"><div style="width:60%"></div></div><p class="hint">Loading sources, mappings, rules and inventory from Google Sheets.</p></div>`;
    api.syncAll().then(() => { render(); toast(api.mode() === 'native' ? 'Connected natively to Google Sheets.' : 'Connected to Apps Script backend.', 'ok'); })
      .catch(function (err) {
        const msg = (err && err.message) ? err.message : String(err);
        state.backendError = msg;
        toast('Backend error: ' + msg, 'err');
        // Demo fallback — UI kabhi blank na rahe
        try {
          if (!state.inventory || !state.inventory.length) {
            const demo = seedAll();
            state.inventory = demo.inventory; state.history = demo.history; state.errors = demo.errors;
            state.sources = demo.sources; state.fieldMapping = demo.fieldMapping;
            state.ageRules = demo.ageRules; state.statusRules = demo.statusRules; state.locationRules = demo.locationRules;
            state.reports = demo.reports; state.reportTemplates = demo.reportTemplates;
          }
        } catch (e2) { /* keep whatever we have */ }
        try { save(); } catch (e3) {}
        render();
      });
  } else {
    render();
  }
}
document.addEventListener('DOMContentLoaded', boot);
