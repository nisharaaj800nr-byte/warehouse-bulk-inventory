/* Robust CSV parser — quoted fields, commas inside quotes, CRLF handling */
function parseCSVText(text) {
  const rows = [];
  let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; }
        else inQ = false;
      } else cell += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.some(c => c.trim() !== '')) rows.push(row);
      row = [];
    } else cell += ch;
  }
  row.push(cell);
  if (row.some(c => c.trim() !== '')) rows.push(row);
  return rows;
}

function screenImport(el) {
  // ── Universal Import wizard ──
  // Steps: upload → preview → mapping → validate → result.
  // Direct import: upload CSV/TSV/XLS/XLSX/PDF or connect a Google Sheet.
  // Configured sources are NOT required here (they live in the Sources screen).
  const TARGETS = MAPPING_TARGET_PRESETS;
  const ALLOWED = ['.csv', '.txt', '.tsv', '.xls', '.xlsx', '.pdf'];
  const MAX_MB = 15;
  const st = {
    step: 'upload',        // upload | preview | mapping | validate | result
    file: null,            // File object
    meta: null,            // {fileName, format, headers, totalRows, totalCols, preview, tabs, activeTab, isPdf, warnings, staging, demo}
    sheetId: '',           // connected sheet id
    mapping: [],           // [{source, target, required}]
    page: 0,               // preview page index
    previewRows: [],       // current preview page rows
    sourceType: '',
    dedupe: false,
    validation: null,      // dry-run result
    commit: null,          // final import result
    working: false
  };

  const suggestTarget = (h) => {
    const s = String(h || '').toLowerCase().trim();
    if (!s) return '';
    if (/(barcode|sku|serial|qr\s*code|bar\s*code)/.test(s)) return 'BARCODE';
    if (/(product|item|name|description)/.test(s)) return 'PRODUCT_NAME';
    if (/(^|_)model($|_)/.test(s) || s === 'model') return 'MODEL';
    if (/(category|type|class)/.test(s)) return 'CATEGORY';
    if (/(brand|make|company)/.test(s)) return 'BRAND';
    if (/(location|godown|store|branch|city|site|warehouse)/.test(s)) return 'LOCATION';
    if (/(bin|rack|shelf|zone)/.test(s)) return 'BIN_BUCKET';
    if (/(status|condition|grade)/.test(s)) return 'STATUS';
    if (/(engineer|technician|assignee|operator)/.test(s)) return 'ENGINEER';
    if (/(marking|mark|stencil)/.test(s)) return 'MARKING';
    if (/(source|vendor|supplier)/.test(s)) return 'SOURCE';
    if (/(priority|urgent)/.test(s)) return 'PRIORITY';
    if (/(^|_)age($|_)/.test(s) || s === 'age') return 'STOCK_AGE';
    return h; // pass-through: keep the raw column name as target
  };

  const autoMap = () => (st.meta ? st.meta.headers.map(h => ({
    source: h,
    target: suggestTarget(h),
    required: /(product|item|barcode|sku|serial|model)/i.test(String(h))
  })) : []);

  const targetOptions = (current) => {
    const set = [];
    TARGETS.forEach(t => { if (set.indexOf(t) < 0) set.push(t); });
    if (current && set.indexOf(current) < 0) set.unshift(current);
    return set.map(t => `<option value="${esc(t)}"${t === current ? ' selected' : ''}>${esc(t)}</option>`).join('') +
      `<option value="__custom__">➕ Custom field…</option>`;
  };

  const fileToBase64 = f => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const b64 = String(r.result).split(',')[1] || ''; res(b64); };
    r.onerror = () => rej(new Error('Could not read the file.'));
    r.readAsDataURL(f);
  });

  const downloadCSV = (rows, name) => {
    const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  };

  const demoParse = (f) => new Promise((res, rej) => {
    const name = (f.name || '').toLowerCase();
    if (name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.pdf')) {
      rej(new Error('Demo mode can preview CSV/TSV only. XLS/XLSX/PDF need the deployed backend (NATIVE or connected API URL).'));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const text = String(reader.result);
        const rows = parseCSVText(text);
        if (rows.length < 2) throw new Error('The file has only headers or is empty — no data rows found.');
        const headers = rows[0].map(h => String(h).trim());
        const data = rows.slice(1, 21);
        res({
          ok: true, demo: true,
          fileName: f.name, format: name.endsWith('.tsv') || name.endsWith('.txt') ? 'TSV/TXT' : 'CSV',
          headers, totalRows: rows.length - 1, totalCols: headers.length,
          preview: data, tabs: null, activeTab: null, isPdf: false, warnings: []
        });
      } catch (e) { rej(e); }
    };
    reader.onerror = () => rej(new Error('Could not read the file.'));
    reader.readAsText(f);
  });

  const showError = (msg) => {
    const box = $('#impStatus');
    if (box) box.innerHTML = `<div class="err-strip">⚠️ ${esc(msg)}</div>`;
  };
  const clearStatus = () => { const box = $('#impStatus'); if (box) box.innerHTML = ''; };

  const handleFile = async (f) => {
    const ext = '.' + String(f.name || '').split('.').pop().toLowerCase();
    if (ALLOWED.indexOf(ext) < 0) {
      toast('Unsupported file format: ' + ext + '. Supported: CSV, TSV, TXT, XLS, XLSX, PDF.', 'err');
      return;
    }
    if (f.size > MAX_MB * 1048576) {
      toast('File is too large (' + Math.round(f.size / 1048576) + ' MB). Maximum file size is ' + MAX_MB + ' MB.', 'err');
      return;
    }
    st.file = f; st.meta = null; st.sheetId = ''; st.working = true; st.step = 'upload';
    draw(); clearStatus();
    const status = $('#impStatus');
    if (status) status.innerHTML = `<div class="card"><h2>⏳ Processing ${esc(f.name)}…</h2><div class="progress"><div class="bar" style="width:60%"></div></div><p class="hint">Uploading and parsing on the backend — large files are processed in batches.</p></div>`;
    try {
      let meta;
      if (NATIVE) {
        const b64 = await fileToBase64(f);
        meta = await api.call('import.fileB64', { b64, fileName: f.name });
      } else if (api.isLive()) {
        const b64 = await fileToBase64(f);
        meta = await api.call('import.fileB64', { b64, fileName: f.name });
      } else {
        meta = await demoParse(f);
      }
      st.meta = meta;
      st.mapping = autoMap();
      st.previewRows = (meta.preview || []).slice(0, 10);
      st.page = 0; st.validation = null; st.commit = null;
      st.step = 'preview';
      toast('Loaded ' + fmt(meta.totalRows) + ' rows · ' + fmt(meta.totalCols) + ' columns from ' + meta.format + '.', 'ok');
      draw();
    } catch (e) {
      st.working = false;
      draw();
      showError(e.message || String(e));
      toast('Import failed: ' + (e.message || e), 'err');
    }
  };

  const connectSheet = async () => {
    const url = ($('#impSheetUrl') ? $('#impSheetUrl').value : '').trim();
    if (!url) { toast('Enter a Google Sheets URL or ID.', 'err'); return; }
    st.working = true; st.meta = null; st.sheetId = url;
    draw(); clearStatus();
    const status = $('#impStatus');
    if (status) status.innerHTML = `<div class="card"><h2>⏳ Connecting to Google Sheet…</h2><div class="progress"><div class="bar" style="width:45%"></div></div></div>`;
    try {
      const meta = await api.call('import.sheets', { sheetId: url });
      st.meta = meta;
      st.mapping = autoMap();
      st.previewRows = (meta.preview || []).slice(0, 10);
      st.page = 0; st.validation = null; st.commit = null;
      st.step = 'preview';
      toast('Sheet connected — ' + fmt(meta.totalRows) + ' rows · ' + fmt(meta.totalCols) + ' columns.', 'ok');
      draw();
    } catch (e) {
      st.working = false;
      draw();
      showError(e.message || String(e));
      toast('Connect failed: ' + (e.message || e), 'err');
    }
  };

  const switchTab = async (tab) => {
    if (!st.sheetId && !(st.meta && st.meta.sourceSheetId)) return;
    st.working = true;
    draw();
    const status = $('#impStatus');
    if (status) status.innerHTML = `<div class="card"><h2>⏳ Loading tab "${esc(tab)}"…</h2><div class="progress"><div class="bar" style="width:50%"></div></div></div>`;
    try {
      const id = st.sheetId || st.meta.sourceSheetId;
      const meta = await api.call('import.sheets', { sheetId: id, tab });
      st.meta = meta; st.sheetId = id;
      st.mapping = autoMap();
      st.previewRows = (meta.preview || []).slice(0, 10);
      st.page = 0; st.validation = null; st.commit = null;
      st.step = 'preview';
      draw();
    } catch (e) {
      st.working = false;
      draw();
      showError(e.message || String(e));
    }
  };

  const loadPreviewPage = async (page) => {
    if (st.meta && st.meta.demo) {
      st.page = page;
      st.previewRows = (st.meta.preview || []).slice(0, 10);
      draw();
      return;
    }
    try {
      const r = await api.call('import.previewPage', { offset: page * 10, limit: 10 });
      st.page = page;
      st.previewRows = r.rows || [];
      draw();
    } catch (e) { toast(e.message || e, 'err'); }
  };

  const runValidation = async () => {
    if (!st.meta) return;
    if (!api.isLive()) {
      st.working = false;
      draw();
      showError('Demo mode cannot validate — deploy the Apps Script (or set the API URL in Settings) to validate and import. Preview above shows the first rows only.');
      return;
    }
    st.working = true;
    draw();
    const status = $('#impStatus');
    if (status) status.innerHTML = `<div class="card"><h2>⏳ Validating ${fmt(st.meta.totalRows)} rows…</h2><div class="progress"><div class="bar" style="width:70%"></div></div></div>`;
    try {
      const v = await api.call('import.commit', {
        mapping: st.mapping, sourceType: st.sourceType, dedupe: st.dedupe, dryRun: true
      });
      st.validation = v;
      st.working = false;
      draw();
      if (v.failed > 0) toast(v.failed + ' row(s) need attention — valid rows can still be imported.', 'warn');
      else toast('All ' + fmt(v.valid) + ' rows are valid.', 'ok');
    } catch (e) {
      st.working = false;
      draw();
      showError(e.message || String(e));
    }
  };

  const doCommit = async () => {
    if (!st.meta) return;
    if (!api.isLive()) {
      st.working = false;
      draw();
      showError('Demo mode cannot import — deploy the Apps Script (or set the API URL in Settings) to import data.');
      return;
    }
    st.working = true;
    draw();
    const status = $('#impStatus');
    if (status) status.innerHTML = `<div class="card"><h2>🚀 Importing ${fmt(st.meta.totalRows)} rows…</h2><div class="progress"><div class="bar" style="width:85%"></div></div><p class="hint">Writing valid rows to RAW_DATA in batches. This may take a moment for large files.</p></div>`;
    try {
      const r = await api.call('import.commit', {
        mapping: st.mapping, sourceType: st.sourceType, dedupe: st.dedupe, dryRun: false
      });
      st.commit = r;
      st.validation = null;
      st.working = false;
      st.step = 'result';
      draw();
      if (r.imported > 0) {
        toast('Import completed — ' + fmt(r.imported) + ' rows imported.' + (r.failed ? ' ' + r.failed + ' failed.' : ''), r.failed ? 'warn' : 'ok');
        if (api.isLive()) { try { await api.syncAll(); } catch (e) {} }
      } else {
        toast('Nothing was imported. Check the validation errors.', 'err');
      }
    } catch (e) {
      st.working = false;
      draw();
      showError(e.message || String(e));
      toast('Import failed: ' + (e.message || e), 'err');
    }
  };

  const reset = () => {
    st.step = 'upload'; st.file = null; st.meta = null; st.sheetId = '';
    st.mapping = []; st.page = 0; st.previewRows = [];
    st.sourceType = ''; st.dedupe = false; st.validation = null; st.commit = null; st.working = false;
    draw();
  };

  const warningsHtml = () => {
    const w = (st.meta && st.meta.warnings) || [];
    if (!w.length) return '';
    return `<div class="warn-strip">${w.map(x => `<div>⚠️ ${esc(x)}</div>`).join('')}</div>`;
  };

  const draw = () => {
    const content = $('#impResult');
    if (!content) return;
    if (st.step === 'upload') {
      content.innerHTML = `
        <div class="card">
          <h2>Import Data</h2>
          <p class="hint">Upload a file or connect a Google Sheet — no source configuration required. Data flows through: upload → preview → column mapping → validation → import.</p>
          <div class="form-grid">
            <div>
              <label>Source Type (optional)</label>
              <select id="impSrcType">
                <option value="">Auto-detect</option>
                <option>Inventory</option>
                <option>QC Stock</option>
                <option>Location</option>
                <option>Other</option>
              </select>
              <p class="hint">Used for categorization only — never blocks the import.</p>
            </div>
          </div>
          <div class="imp-drop" id="impDrop">
            <div class="imp-drop-icon">📥</div>
            <div class="imp-drop-title"><strong>Drag &amp; drop your file here</strong></div>
            <div class="hint">or</div>
            <button class="btn" id="impBrowse" type="button">Browse Files</button>
            <input type="file" id="impFile" accept=".csv,.txt,.tsv,.xls,.xlsx,.pdf" multiple hidden>
            <div class="hint imp-formats">CSV · TSV · TXT · XLS · XLSX · PDF — max ${MAX_MB} MB</div>
          </div>
          <div class="imp-or"><span>— or connect —</span></div>
          <div class="form-grid">
            <div style="grid-column:1/-1">
              <label>Google Sheets URL / ID</label>
              <div class="row" style="gap:8px">
                <input type="text" id="impSheetUrl" placeholder="https://docs.google.com/spreadsheets/d/…" style="flex:1">
                <button class="btn primary" id="impConnect" type="button">Connect Google Sheet</button>
              </div>
              <p class="hint">Multi-tab sheets are supported — pick the tab after connecting.</p>
            </div>
          </div>
        </div>
        <div id="impStatus"></div>`;
      const drop = $('#impDrop');
      const fileInput = $('#impFile');
      if (drop) {
        drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
        drop.ondragleave = () => drop.classList.remove('drag');
        drop.ondrop = e => {
          e.preventDefault(); drop.classList.remove('drag');
          const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (f) handleFile(f);
        };
        drop.onclick = () => fileInput && fileInput.click();
      }
      if (fileInput) fileInput.onchange = () => {
        const files = fileInput.files && fileInput.files.length ? Array.from(fileInput.files) : [];
        if (!files.length) return;
        if (files.length > 1) {
          msQueue = files;
          navigate('multisource');
          toast('Multiple files selected — routed to Multi-Source Import.', 'ok');
          return;
        }
        handleFile(files[0]);
      };
      const ct = $('#impConnect');
      if (ct) ct.onclick = connectSheet;
      const srcSel = $('#impSrcType');
      if (srcSel) srcSel.onchange = () => { st.sourceType = srcSel.value; };
      return;
    }

    if (st.step === 'preview') {
      const meta = st.meta;
      if (!meta) { reset(); return; }
      const rows = st.previewRows;
      const headers = meta.headers || [];
      const maxCols = Math.min(headers.length, 12);
      const pages = Math.max(1, Math.ceil(meta.totalRows / 10));
      const tabs = meta.tabs && meta.tabs.length > 1
        ? `<div class="imp-tabs">${meta.tabs.map(t =>
            `<button class="chip${t.name === (meta.activeTab || meta.tabs[0].name) ? ' on' : ''}" data-tab="${esc(t.name)}">${esc(t.name)} <span class="hint">(${fmt(t.rows)}r)</span></button>`).join('')}</div>`
        : '';
      content.innerHTML = `
        <div class="card">
          <div class="toolbar">
            <h2 style="margin:0">📄 Data Preview</h2><div class="spacer"></div>
            <span class="badge b-info">${esc(meta.format)}</span>
            <span class="badge b-ok">${fmt(meta.totalRows)} rows · ${fmt(meta.totalCols)} cols</span>
          </div>
          <p class="hint">File: <strong>${esc(meta.fileName)}</strong>${meta.demo ? ' — demo preview (deploy or connect the backend to import)' : ''}</p>
          ${warningsHtml()}
          ${tabs}
          <div class="tbl-wrap"><table>
            <thead><tr>${headers.slice(0, maxCols).map(h => `<th>${esc(h || '(empty)')}</th>`).join('')}${headers.length > maxCols ? `<th>… +${headers.length - maxCols} more</th>` : ''}</tr></thead>
            <tbody>${rows.length ? rows.map(r => `<tr>${Array.from({ length: Math.min(r.length, maxCols) }, (_, i) => `<td>${esc(String(r[i] ?? '')) || '<span class="dim">—</span>'}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${maxCols}" class="tbl-empty">No rows on this page.</td></tr>`}</tbody>
          </table></div>
          <div class="row" style="justify-content:space-between;align-items:center;margin-top:8px">
            <button class="btn" id="impPrevPage" type="button" ${st.page <= 0 ? 'disabled' : ''}>← Prev</button>
            <span class="hint">Page ${st.page + 1} of ${pages}</span>
            <button class="btn" id="impNextPage" type="button" ${st.page >= pages - 1 ? 'disabled' : ''}>Next →</button>
          </div>
          <div class="btn-row" style="margin-top:12px">
            <button class="btn" id="impBackUpload" type="button">← Change file</button>
            <div class="spacer"></div>
            <button class="btn primary" id="impToMap" type="button">Continue → Map Columns</button>
          </div>
        </div>
        <div id="impStatus"></div>`;
      const bp = $('#impBackUpload'); if (bp) bp.onclick = reset;
      const pv = $('#impPrevPage'); if (pv) pv.onclick = () => loadPreviewPage(st.page - 1);
      const nx = $('#impNextPage'); if (nx) nx.onclick = () => loadPreviewPage(st.page + 1);
      const tm = $('#impToMap'); if (tm) tm.onclick = () => { st.step = 'mapping'; draw(); };
      content.querySelectorAll('[data-tab]').forEach(ch => {
        ch.onclick = () => switchTab(ch.getAttribute('data-tab'));
      });
      return;
    }

    if (st.step === 'mapping') {
      const meta = st.meta;
      if (!meta) { reset(); return; }
      const map = st.mapping;
      const mappedTargets = map.map(m => m.target);
      content.innerHTML = `
        <div class="card">
          <div class="toolbar">
            <h2 style="margin:0">🧩 Column Mapping</h2><div class="spacer"></div>
            <button class="btn" id="impAutoMap" type="button">✨ Auto Map</button>
          </div>
          <p class="hint">Map imported columns to system fields. Unmapped columns keep their original name (pass-through). Mark required fields — rows missing them are flagged before import.</p>
          ${warningsHtml()}
          <div class="tbl-wrap"><table>
            <thead><tr><th>Imported Column</th><th>→ System Field</th><th class="num">Required</th></tr></thead>
            <tbody>${map.map((m, i) => `
              <tr>
                <td><strong>${esc(m.source)}</strong></td>
                <td style="min-width:220px">
                  <select id="impTgt_${i}" class="imp-tgt">
                    ${targetOptions(m.target)}
                  </select>
                </td>
                <td class="num"><input type="checkbox" id="impReq_${i}" ${m.required ? 'checked' : ''}></td>
              </tr>`).join('')}
            </tbody>
          </table></div>
          <div class="btn-row" style="margin-top:12px">
            <button class="btn" id="impBackPrev" type="button">← Back to Preview</button>
            <div class="spacer"></div>
            <button class="btn primary" id="impToVal" type="button">Validate Data →</button>
          </div>
        </div>
        <div id="impStatus"></div>`;
      const auto = $('#impAutoMap');
      if (auto) auto.onclick = () => { st.mapping = autoMap(); draw(); };
      const back = $('#impBackPrev');
      if (back) back.onclick = () => { st.step = 'preview'; draw(); };
      const val = $('#impToVal');
      if (val) val.onclick = () => { st.step = 'validate'; draw(); runValidation(); };
      map.forEach((m, i) => {
        const sel = $('#impTgt_' + i);
        if (sel) sel.onchange = async () => {
          if (sel.value === '__custom__') {
            const name = await promptDlg('Custom Target Field', 'Enter the system field name for "' + m.source + '"', m.target);
            if (name && name.trim()) { m.target = name.trim(); draw(); return; }
            sel.value = m.target; return;
          }
          m.target = sel.value;
        };
        const req = $('#impReq_' + i);
        if (req) req.onchange = () => { m.required = req.checked; };
      });
      return;
    }

    if (st.step === 'validate') {
      const meta = st.meta;
      const v = st.validation;
      if (!meta) { reset(); return; }
      content.innerHTML = `
        <div class="card">
          <div class="toolbar"><h2 style="margin:0">✅ Validation</h2><div class="spacer"></div>
            <span class="badge b-info">${esc(meta.format)}</span>
            <span class="badge b-ok">${fmt(meta.totalRows)} rows</span>
          </div>
          <div class="form-grid" style="margin:10px 0">
            <div>
              <label>Source Type (optional)</label>
              <select id="impSrcType2">
                <option value="">Auto-detect</option>
                <option>Inventory</option>
                <option>QC Stock</option>
                <option>Location</option>
                <option>Other</option>
              </select>
            </div>
            <div>
              <label>Skip duplicate rows</label>
              <select id="impDedupe">
                <option value="0">No — import all valid rows</option>
                <option value="1">Yes — skip exact duplicates (by mapped fields)</option>
              </select>
            </div>
          </div>
          ${v ? `
            <div class="grid three">
              <div class="kpi k-ok"><div class="k-label">Valid</div><div class="k-value">${fmt(v.valid)}</div></div>
              <div class="kpi ${v.failed ? 'k-err' : 'k-ok'}"><div class="k-label">Needs attention</div><div class="k-value">${fmt(v.failed)}</div></div>
              <div class="kpi k-info"><div class="k-label">Duplicates skipped</div><div class="k-value">${fmt(v.skipped)}</div></div>
            </div>
            ${v.failed ? `
              <div class="warn-strip"><div>⚠️ ${fmt(v.failed)} row(s) failed validation and will be skipped — valid rows will still be imported. Details are recorded in the "Import Errors" sheet.</div></div>
              <div class="tbl-wrap"><table>
                <thead><tr><th class="num">Row</th><th>Reason</th></tr></thead>
                <tbody>${(v.errorSample || []).slice(0, 15).map(e => `<tr><td class="num">${e.row}</td><td>${esc(e.errors.join('; '))}</td></tr>`).join('') || '<tr><td colspan="2" class="tbl-empty">No errors.</td></tr>'}</tbody>
              </table></div>` : `<div class="ok-strip">✔ All rows are valid and ready to import.</div>`}
          ` : `<div class="hint">Running validation…</div>`}
          <div class="btn-row" style="margin-top:12px">
            <button class="btn" id="impBackMap" type="button">← Fix Mapping</button>
            <div class="spacer"></div>
            <button class="btn primary" id="impGo" type="button" ${v && !st.working ? '' : 'disabled'}>🚀 Import Data</button>
          </div>
        </div>
        <div id="impStatus"></div>`;
      const src2 = $('#impSrcType2');
      if (src2) src2.onchange = () => { st.sourceType = src2.value; runValidation(); };
      const ded = $('#impDedupe');
      if (ded) ded.onchange = () => { st.dedupe = ded.value === '1'; runValidation(); };
      const bm = $('#impBackMap');
      if (bm) bm.onclick = () => { st.step = 'mapping'; draw(); };
      const go = $('#impGo');
      if (go) go.onclick = () => { if (v) doCommit(); };
      return;
    }

    if (st.step === 'result') {
      const meta = st.meta;
      const r = st.commit;
      if (!meta || !r) { reset(); return; }
      const errRows = (r.errorSample || []).slice(0, 10);
      content.innerHTML = `
        <div class="card">
          <div class="toolbar">
            <h2 style="margin:0">${r.imported > 0 ? '🎉 Import Completed' : '⚠️ Import Completed — Nothing Imported'}</h2><div class="spacer"></div>
            <span class="badge b-info">${esc(meta.format)}</span>
          </div>
          <div class="grid three">
            <div class="kpi k-info"><div class="k-label">Rows Processed</div><div class="k-value">${fmt(r.processed)}</div></div>
            <div class="kpi k-ok"><div class="k-label">Imported</div><div class="k-value">${fmt(r.imported)}</div></div>
            <div class="kpi ${r.failed ? 'k-err' : 'k-ok'}"><div class="k-label">Failed / Skipped</div><div class="k-value">${fmt(r.failed)} / ${fmt(r.skipped)}</div></div>
          </div>
          ${(r.warnings || []).map(w => `<div class="warn-strip"><div>⚠️ ${esc(w)}</div></div>`).join('')}
          ${r.failed ? `
            <div class="tbl-wrap"><table>
              <thead><tr><th class="num">Row</th><th>Reason</th></tr></thead>
              <tbody>${errRows.map(e => `<tr><td class="num">${e.row}</td><td>${esc(e.errors.join('; '))}</td></tr>`).join('')}</tbody>
            </table></div>` : ''}
          <div class="btn-row" style="margin-top:12px">
            <button class="btn" id="impErrDl" type="button">⬇ Download Error Report</button>
            <button class="btn" id="impRaw" type="button">View RAW_DATA</button>
            <button class="btn" id="impRunProc" type="button">▶ Run Processing</button>
            <div class="spacer"></div>
            <button class="btn primary" id="impAgain" type="button">Import Another File</button>
          </div>
        </div>
        <div id="impStatus"></div>`;
      const dl = $('#impErrDl');
      if (dl) dl.onclick = () => downloadCSV(
        [['Row', 'Reason']].concat((r.errorSample || []).map(e => [e.row, e.errors.join('; ')])),
        'import-error-report.csv');
      const raw = $('#impRaw');
      if (raw) raw.onclick = () => { navigate('inventory'); };
      const run = $('#impRunProc');
      if (run) run.onclick = () => { navigate('processing'); setTimeout(() => { try { runPipelineUI(); } catch (e) {} }, 200); };
      const again = $('#impAgain');
      if (again) again.onclick = reset;
      return;
    }
    reset();
  };

  el.innerHTML = '<div id="impResult"></div>';
  draw();
}
/* Pipeline run shared by Import, Processing screen, topbar and AI */
function runPipelineUI() {
  if (!roleGuard('OPERATOR')) return;
  const btn = $('#runBtn');
  if (btn) btn.disabled = true;
  const content = $('#content');
  const start = Date.now();
  const holder = (currentRoute() === 'processing' || currentRoute() === 'import') ? ($('#procLive') || $('#impResult')) : null;
  const showDone = (res) => {
    if (!holder) return;
    holder.innerHTML = `
      <div class="card">
        <h2>Processing Complete</h2>
        <div class="grid three">
          <div class="kpi k-ok"><div class="k-label">Processed Rows</div><div class="k-value">${fmt(res.processedRows || res.processed || 0)}</div></div>
          <div class="kpi k-warn"><div class="k-label">Errors</div><div class="k-value">${fmt(res.errors || 0)}</div></div>
          <div class="kpi k-info"><div class="k-label">Run ID</div><div class="k-value" style="font-size:14px">${esc(res.runId || state.settings.runId)}</div></div>
        </div>
        <div class="btn-row">
          <button class="btn" onclick="navigate('inventory')">View Inventory</button>
          <button class="btn" onclick="navigate('reports')">Generate Reports</button>
          <button class="btn" onclick="navigate('quality')">Review Errors</button>
        </div>
      </div>`;
  };
  /* Live / native mode: run the real backend pipeline */
  if (api.isLive()) {
    if (holder) holder.innerHTML = `<div class="card"><h2>Processing on backend…</h2><div class="progress"><div style="width:55%"></div></div><p class="hint">Reading raw data → extracting fields → joining QC Stock & Location → applying rules → generating inventory → reports → email.</p></div>`;
    api.call('process.run').then(async res => {
      await api.syncAll();
      showDone(res);
      toast(`Daily process complete: ${fmt(res.processedRows || state.inventory.length)} rows, ${fmt(res.errors || 0)} errors.`, res.status === 'SUCCESS' ? 'ok' : (res.errors ? 'warn' : 'ok'));
      if (btn) btn.disabled = false;
      render();
    }).catch(err => {
      if (holder) holder.innerHTML = `<div class="card"><h2>❌ Processing failed</h2><p class="hint">${esc(err.message)}</p></div>`;
      toast('Processing failed: ' + err.message, 'err');
      if (btn) btn.disabled = false;
      render();
    });
    return;
  }
  /* Demo mode: local simulation */
  const doRun = (progressEl) => {
    setTimeout(() => {
      const rawIn = state.inventory.length + 37;
      const errors = [
        { runId: state.settings.runId, row: 118, barcode: '8901234567012', source: 'STATUS_ENGINE', field: 'Status', error: 'Unknown status: "Pending QC"', ts: new Date().toISOString().slice(0, 10) },
        { runId: state.settings.runId, row: 131, barcode: '', source: 'AGE_ENGINE', field: 'Age', error: 'Invalid or missing age value', ts: new Date().toISOString().slice(0, 10) }
      ];
      state.errors = errors.concat(state.errors).slice(0, 50);
      state.history.unshift({
        runId: state.settings.runId, date: new Date().toISOString().slice(0, 10), source: 'Daily Raw Data',
        input: rawIn, processed: state.inventory.length, errors: errors.length,
        duration: ((Date.now() - start) / 1000).toFixed(1), status: 'PARTIAL_SUCCESS'
      });
      state.audit.unshift({ ts: new Date().toISOString(), user: currentUser.email, action: 'PROCESS_COMPLETED', object: 'Daily Process', result: 'PARTIAL_SUCCESS' });
      save();
      if (progressEl) {
        progressEl.innerHTML = `
          <div class="card">
            <h2>Processing Complete</h2>
            <div class="grid three">
              <div class="kpi k-ok"><div class="k-label">Processed Rows</div><div class="k-value">${fmt(state.inventory.length)}</div></div>
              <div class="kpi k-warn"><div class="k-label">Errors</div><div class="k-value">${fmt(errors.length)}</div></div>
              <div class="kpi k-info"><div class="k-label">Run ID</div><div class="k-value" style="font-size:14px">${esc(state.settings.runId)}</div></div>
            </div>
            <div class="btn-row">
              <button class="btn" onclick="navigate('inventory')">View Inventory</button>
              <button class="btn" onclick="navigate('reports')">Generate Reports</button>
              <button class="btn" onclick="navigate('quality')">Review Errors</button>
            </div>
          </div>`;
      }
      toast(`Daily process complete: ${fmt(state.inventory.length)} rows, ${errors.length} errors.`, errors.length ? 'warn' : 'ok');
      if (btn) btn.disabled = false;
      render();
    }, 900);
  };
  if (currentRoute() === 'processing' || currentRoute() === 'import') {
    if (holder) holder.innerHTML = `<div class="card"><h2>Processing Daily Raw Data...</h2><div class="progress"><div style="width:45%"></div></div><p class="hint">Extracting fields → joining QC Stock & Location → applying rules → generating inventory.</p></div>`;
    doRun(holder);
  } else {
    doRun(null);
  }
}

/* ────────────────────────── SCREEN: FIELD MAPPING ────────────────────────── */
const MAPPING_TARGET_PRESETS = ['BARCODE','PRODUCT_NAME','MODEL','CATEGORY','BRAND','SOURCE','MOD_AGE','STOCK_AGE','STATUS','AGE_BUCKET','PRIORITY','STATUS_BUCKET','LOCATION','BIN_BUCKET','MARKING','ENGINEER'];
function screenMapping(el) {
  const targetOptions = MAPPING_TARGET_PRESETS;
  el.innerHTML = `
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0">Field Mapping</h2><div class="spacer"></div>
        <button class="btn" id="populateMap">⬇ Populate from Raw Data</button>
        <button class="btn" id="autoMap">✨ Auto Map</button>
        <button class="btn" id="validateMap">Validate Mapping</button>
        <button class="btn primary" id="saveMap">Save Mapping</button>
      </div>
      <p class="hint">Map raw data columns to standardized target fields. Output order follows the Order column. "Populate from Raw Data" auto-fills all RAW_DATA columns — remove any field you don't need with ✕.</p>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Source</th><th>Source Column</th><th>→ Target Field</th><th>Required</th><th>Active</th><th class="num">Order</th><th></th></tr></thead>
        <tbody id="mapBody"></tbody>
      </table></div>
      <button class="btn sm" id="addMap" style="margin-top:10px">+ Add Mapping</button>
    </div>`;
  const body = $('#mapBody');
  const targetOptionsHtml = (selected, extra) => `${targetOptions.map(t => `<option ${selected === t ? 'selected' : ''}>${t}</option>`).join('')}${extra ? `<option value="__custom__" ${!targetOptions.includes(selected) ? 'selected' : ''}>➕ Custom field…</option>` : ''}`;
  const renderRows = () => {
    body.innerHTML = state.fieldMapping.map((m, i) => `
      <tr>
        <td><input type="text" value="${esc(m.source)}" data-i="${i}" data-k="source" class="m-in" placeholder="Source name"></td>
        <td><input type="text" value="${esc(m.sourceColumn)}" data-i="${i}" data-k="sourceColumn" class="m-in" placeholder="Raw column name"></td>
        <td><select data-i="${i}" data-k="target" class="m-in">${targetOptionsHtml(m.target, true)}</select></td>
        <td><select data-i="${i}" data-k="required" class="m-in">${['YES','NO'].map(v => `<option ${m.required === v ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
        <td><select data-i="${i}" data-k="active" class="m-in">${['ON','OFF'].map(v => `<option ${m.active === v ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
        <td><input type="number" value="${m.order}" data-i="${i}" data-k="order" class="m-in" style="width:70px"></td>
        <td><button class="btn sm danger" data-del="${i}">✕</button></td>
      </tr>`).join('');
    $$('.m-in', body).forEach(inp => inp.onchange = async e => {
      const i = +e.target.dataset.i, k = e.target.dataset.k;
      if (k === 'target' && e.target.value === '__custom__') {
        const name = await promptDlg('Custom Target Field', 'Name of the new target field', '');
        if (!name) { renderRows(); return; }
        const clean = name.trim().toUpperCase().replace(/\s+/g, '_');
        if (!MAPPING_TARGET_PRESETS.includes(clean)) MAPPING_TARGET_PRESETS.push(clean);
        state.fieldMapping[i][k] = clean;
      } else {
        state.fieldMapping[i][k] = k === 'order' ? +e.target.value : e.target.value;
      }
      save(); renderRows();
    });
    $$('[data-del]', body).forEach(b => b.onclick = () => { state.fieldMapping.splice(+b.dataset.del, 1); save(); renderRows(); });
  };
  renderRows();
  $('#addMap').onclick = async () => {
    const target = await promptDlg('Target Field', 'Target field name (you can also type a new one)', 'MODEL');
    if (!target) return;
    const clean = target.trim().toUpperCase().replace(/\s+/g, '_');
    if (!MAPPING_TARGET_PRESETS.includes(clean)) MAPPING_TARGET_PRESETS.push(clean);
    const srcCol = await promptDlg('Source Column', 'Raw data ka column naam', '');
    state.fieldMapping.push({ source: 'Daily Raw Data', sourceColumn: srcCol || '', target: clean, required: 'NO', active: 'ON', order: state.fieldMapping.length + 1 });
    save(); renderRows();
  };
  $('#populateMap').onclick = async () => {
    if (!api.isLive()) { toast('Demo mode: auto-fill from RAW_DATA headers is available in live mode.', 'info'); return; }
    const btn = $('#populateMap');
    btn.disabled = true; btn.innerHTML = '⏳ Reading RAW_DATA…';
    try {
      const r = await api.call('mapping.headers');
      const headers = r.headers || [];
      if (!headers.length) { toast('No headers found in RAW_DATA — import data first.', 'warn'); return; }
      let added = 0;
      headers.forEach(h => {
        if (!state.fieldMapping.some(m => m.sourceColumn.trim().toLowerCase() === h.toLowerCase())) {
          state.fieldMapping.push({ source: 'Daily Raw Data', sourceColumn: h, target: MAPPING_TARGET_PRESETS.includes(h.toUpperCase()) ? h.toUpperCase() : h.toUpperCase().replace(/\s+/g, '_'), required: h.toUpperCase() === 'BARCODE' ? 'YES' : 'NO', active: 'ON', order: state.fieldMapping.length + 1 });
          added++;
        }
      });
      save(); renderRows();
      toast(added + ' new mapping(s) added from RAW_DATA headers. Delete any you do not need with ✕.', added ? 'ok' : 'info');
    } catch (e) { toast('Populate failed: ' + e.message, 'err'); }
    finally { btn.disabled = false; btn.innerHTML = '⬇ Populate from Raw Data'; }
  };
  $('#saveMap').onclick = async () => {
    if (!roleGuard('ADMIN')) return;
    if (api.isLive()) {
      const btn = $('#saveMap');
      btn.disabled = true; btn.innerHTML = '⏳ Saving…';
      try { await api.call('mapping.save', { mappings: state.fieldMapping }); toast('Field mapping saved on backend.', 'ok'); }
      catch (e) { toast('Save failed: ' + e.message, 'err'); }
      finally { btn.disabled = false; btn.innerHTML = 'Save Mapping'; }
    } else { save(); toast('Field mapping saved.', 'ok'); }
  };
  $('#validateMap').onclick = () => {
    const missing = state.fieldMapping.filter(m => m.required === 'YES' && !m.sourceColumn.trim());
    const noTarget = state.fieldMapping.filter(m => !m.target.trim());
    if (missing.length) toast('Validation failed: ' + missing.length + ' required mapping(s) missing source column.', 'err');
    else if (noTarget.length) toast('Validation failed: ' + noTarget.length + ' mapping(s) missing target field.', 'err');
    else toast('Mapping valid.', 'ok');
  };
  $('#autoMap').onclick = () => {
    const synonyms = { BARCODE: ['barcode','barcode number','device barcode','code','sku'], PRODUCT_NAME: ['product name','product','name','item'], MODEL: ['model','model name','model no'], BRAND: ['brand','make','company'], CATEGORY: ['category','type','device type'], SOURCE: ['source name','source','vendor','supplier'], MOD_AGE: ['mod age','age (mod)','modification age'], STOCK_AGE: ['stock age','age','age (stock)','days in stock'], STATUS: ['status','condition','state'] };
    state.fieldMapping.forEach(m => {
      const lower = m.sourceColumn.trim().toLowerCase();
      for (const [target, keys] of Object.entries(synonyms)) {
        if (keys.some(k => lower.includes(k))) { m.target = target; break; }
      }
    });
    save(); renderRows(); toast('Auto-map proposed — review before saving.', 'warn');
  };
}

/* ────────────────────────── SCREEN: INVENTORY ────────────────────────── */
const INV_COLS = ['BARCODE','PRODUCT_NAME','MODEL','CATEGORY','BRAND','SOURCE','MOD_AGE','STOCK_AGE','AGE_BUCKET','PRIORITY','STATUS','STATUS_BUCKET','LOCATION','BIN_BUCKET','ENGINEER'];
let invFilters = { q: '', brand: '', category: '', status: '', age: '', priority: '', location: '', page: 1, perPage: 15 };

function screenInventory(el) {
  const uniq = arr => [...new Set(arr.filter(Boolean))].sort();
  el.innerHTML = `
    <div class="card">
      <div class="toolbar">
        <div class="search"><input type="text" id="invQ" placeholder="Search barcode / model / brand..." value="${esc(invFilters.q)}"></div>
        <div class="filters">
          <select id="fBrand"><option value="">Brand: All</option>${uniq(state.inventory.map(r => r.BRAND)).map(v => `<option ${invFilters.brand === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>
          <select id="fCategory"><option value="">Category: All</option>${uniq(state.inventory.map(r => r.CATEGORY)).map(v => `<option ${invFilters.category === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>
          <select id="fStatus"><option value="">Status: All</option>${uniq(state.inventory.map(r => r.STATUS_BUCKET)).map(v => `<option ${invFilters.status === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>
          <select id="fAge"><option value="">Age Bucket: All</option>${uniq(state.inventory.map(r => r.AGE_BUCKET)).map(v => `<option ${invFilters.age === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>
          <select id="fPriority"><option value="">Priority: All</option>${uniq(state.inventory.map(r => r.PRIORITY)).map(v => `<option ${invFilters.priority === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>
          <select id="fLocation"><option value="">Location: All</option>${uniq(state.inventory.map(r => r.LOCATION)).map(v => `<option ${invFilters.location === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>
        </div>
        <div class="spacer"></div>
        <button class="btn primary" id="invAdd">+ Add Item</button>
        <button class="btn" id="invScan">📷 Scan</button>
        <button class="btn" id="invRefresh">↻ Refresh</button>
        <button class="btn" id="invReset">Reset</button>
        <button class="btn ok" id="invExport">⬇ CSV</button>
      </div>
      <div id="invTable"></div>
      <div class="pager" id="invPager"></div>
    </div>`;

  const applyFilters = () => {
    const q = invFilters.q.toLowerCase();
    let rows = state.inventory.filter(r => {
      if (q && !(r.BARCODE + r.MODEL + r.BRAND + r.PRODUCT_NAME).toLowerCase().includes(q)) return false;
      if (invFilters.brand && r.BRAND !== invFilters.brand) return false;
      if (invFilters.category && r.CATEGORY !== invFilters.category) return false;
      if (invFilters.status && r.STATUS_BUCKET !== invFilters.status) return false;
      if (invFilters.age && r.AGE_BUCKET !== invFilters.age) return false;
      if (invFilters.priority && r.PRIORITY !== invFilters.priority) return false;
      if (invFilters.location && r.LOCATION !== invFilters.location) return false;
      return true;
    });
    const totalPages = Math.max(1, Math.ceil(rows.length / invFilters.perPage));
    if (invFilters.page > totalPages) invFilters.page = totalPages;
    const start = (invFilters.page - 1) * invFilters.perPage;
    const pageRows = rows.slice(start, start + invFilters.perPage);
    $('#invTable').innerHTML = dataTable(
      INV_COLS.map(c => ({ label: c, num: ['MOD_AGE','STOCK_AGE'].includes(c) })),
      pageRows.map(r => ({ click: `openInvDetail('${r.BARCODE}')`, cells: INV_COLS.map(c => c === 'PRIORITY' ? badge(r[c] || '—', r[c] === 'P4' ? 'b-err' : r[c] === 'P3' ? 'b-warn' : 'b-info') : esc(r[c] ?? '')) })),
      { emptyMsg: 'No inventory records match the filters.' }
    );
    $('#invPager').innerHTML = `
      <span>${fmt(rows.length)} records</span>
      <button class="btn sm" ${invFilters.page <= 1 ? 'disabled' : ''} onclick="invFilters.page--;screenInventory($('#content'))">‹ Prev</button>
      <span>Page ${invFilters.page} / ${totalPages}</span>
      <button class="btn sm" ${invFilters.page >= totalPages ? 'disabled' : ''} onclick="invFilters.page++;screenInventory($('#content'))">Next ›</button>`;
  };
  applyFilters();

  $('#invQ').oninput = e => { invFilters.q = e.target.value; invFilters.page = 1; applyFilters(); };
  $('#fBrand').onchange = e => { invFilters.brand = e.target.value; invFilters.page = 1; applyFilters(); };
  $('#fCategory').onchange = e => { invFilters.category = e.target.value; invFilters.page = 1; applyFilters(); };
  $('#fStatus').onchange = e => { invFilters.status = e.target.value; invFilters.page = 1; applyFilters(); };
  $('#fAge').onchange = e => { invFilters.age = e.target.value; invFilters.page = 1; applyFilters(); };
  $('#fPriority').onchange = e => { invFilters.priority = e.target.value; invFilters.page = 1; applyFilters(); };
  $('#fLocation').onchange = e => { invFilters.location = e.target.value; invFilters.page = 1; applyFilters(); };
  $('#invReset').onclick = () => { invFilters = { q: '', brand: '', category: '', status: '', age: '', priority: '', location: '', page: 1, perPage: 15 }; render(); };
  $('#invRefresh').onclick = () => refreshAll();
  $('#invExport').onclick = () => exportCSV('inventory', INV_COLS.map(c => c), state.inventory);
  $('#invScan').onclick = () => barcodeScanModal();

function barcodeScanModal() {
  const m = openModal(`
    <div class="modal-head"><h3>📷 Barcode Scanner</h3><button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
    <p class="hint">Scan with your camera (supported browsers) or enter a barcode manually — it will search the Inventory directly.</p>
    <div class="form-grid">
      <div><label>Barcode</label><input type="text" id="scanVal" placeholder="Scan or type a barcode..." autofocus></div>
    </div>
    <div id="scanVideoWrap" style="text-align:center;margin:10px 0;display:none"><video id="scanVideo" style="width:100%;max-width:340px;border-radius:8px;background:#111" playsinline muted></video></div>
    <div class="btn-row">
      <button class="btn" id="scanStart">📷 Start Camera</button>
      <button class="btn primary" id="scanGo">Search</button>
      <button class="btn" id="scanCancel">Cancel</button>
    </div>
    <div id="scanOut"></div>
    </div>
  `, { sticky: true });
  const wrap = $('#scanVideoWrap'), video = $('#scanVideo'), out = $('#scanOut');
  let stream = null, detector = null;
  const stopCam = () => {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    wrap.style.display = 'none';
  };
  m.close = (() => { const c = m.close; return () => { stopCam(); c(); }; })();
  const sc = $('#scanCancel');
  if (sc) sc.onclick = () => m.close();
  const lookup = val => {
    if (!val) { out.innerHTML = '<p class="hint">Enter a barcode.</p>'; return; }
    const hit = state.inventory.find(r => r.BARCODE === val);
    if (hit) { out.innerHTML = `<p class="hint">✅ Found: ${esc(hit.MODEL)} (${esc(hit.BRAND)})</p>`; invFilters = { ...invFilters, q: val, page: 1 }; render(); }
    else { out.innerHTML = `<p class="hint">❌ Barcode ${esc(val)} not found in inventory.</p>`; }
  };
  $('#scanGo').onclick = () => { lookup($('#scanVal').value.trim()); };
  $('#scanVal').addEventListener('keydown', e => { if (e.key === 'Enter') lookup(e.target.value.trim()); });
  $('#scanStart').onclick = async () => {
    if (typeof BarcodeDetector === 'undefined') {
      out.innerHTML = '<p class="hint">❌ Camera scanning not supported in this browser — use Chrome/Edge or manual entry.</p>';
      return;
    }
    try {
      detector = new BarcodeDetector({ formats: ['qr_code', 'ean_13', 'code_128', 'code_39'] });
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      wrap.style.display = 'block';
      await video.play();
      out.innerHTML = '<p class="hint">Scanning… hold the barcode in front of the camera.</p>';
      const loop = async () => {
        if (!stream) return;
        try {
          const codes = await detector.detect(video);
          if (codes && codes.length) {
            lookup(codes[0].rawValue);
            stopCam();
            return;
          }
        } catch (e) { /* frame error */ }
        setTimeout(loop, 250);
      };
      loop();
    } catch (e) {
      out.innerHTML = '<p class="hint">❌ Camera access denied/unavailable: ' + esc(e.message) + '</p>';
    }
  };
}

    const overlap = state.ageRules.some((r, i) => (rule ? r !== rule : true) && r.active === 'ON' && min <= r.max && max >= r.min);

  $$('[data-prev]', el).forEach(b => b.onclick = () => {

    if (!roleGuard('MANAGER')) return;
    const r = state.reports[+b.dataset.tpl];
    const name = await promptDlg('Save as Template', 'Template name', r.name + ' Layout');
    if (!name) return;
    const tpl = { id: 'TPL' + String(state.reportTemplates.length + 1).padStart(3, '0'), name, active: 'ON', config: { type: r.type, filterField: r.filterField, filterValue: r.filterValue, columns: r.columns, output: r.output, recipients: r.recipients, groupBy: r.groupBy || '', headerText: r.headerText || '', footerText: r.footerText || '', orientation: r.orientation || 'Portrait', summary: r.summary || 'OFF' } };
    if (api.isLive()) {
      try { await api.call('reports.templates.save', { name, configJson: JSON.stringify(tpl.config) }); toast('Template saved on backend.', 'ok'); } catch (e) { toast('Save failed: ' + e.message, 'err'); }
    } else {
      state.reportTemplates.push(tpl);
      state.audit.unshift({ ts: new Date().toISOString(), user: currentUser.email, action: 'TEMPLATE_SAVED', object: name, result: 'OK' });
      save(); toast('Template saved.', 'ok');
    }
  });
  $$('[data-del]', el).forEach(b => b.onclick = async () => {
    if (!roleGuard('ADMIN')) return;
    if (await confirmDlg('Delete report', 'Delete this report?', 'Delete', true)) {
      const r = state.reports[+b.dataset.del];
      if (api.isLive()) {
        try { await api.call('reports.delete', { name: r.name }); toast('Report deleted on backend.', 'ok'); } catch (e) { toast('Delete failed: ' + e.message, 'err'); }
      } else {
        state.reports.splice(+b.dataset.del, 1); save(); render();
      }
    }
  });
  const repBtn = $('#repExportSheet');
  if (repBtn) repBtn.onclick = async () => {
    if (!roleGuard('MANAGER')) return;
    if (api.isLive()) {
      try {
        const r = await api.call('reports.exportToSheet');
        toast('Report Output sheet updated: ' + r.reportCount + ' report(s), ' + r.totalRows + ' rows.', 'ok');
      } catch (e) { toast('Export failed: ' + e.message, 'err'); }
    } else {
      toast('Demo mode: in live mode, each report writes its filtered data section-wise into the "Report Output" sheet (INVENTORY untouched).', 'info');
    }
  };
}

Samsung
Vivo
Oppo"></textarea>

/* ────────────────────────── SCREEN: REPORT BUILDER ────────────────────────── */
function screenBuilder(el) {
  const cols = INV_COLS;
  const editIdx = builderEditId;
  const editR = editIdx !== null ? state.reports[editIdx] : null;
  const tpl = builderTemplate;
  const def = editR || tpl || {};
  const isTpl = !editR && !!tpl;
  el.innerHTML = `
    <div class="card">
      <div class="toolbar"><h2 style="margin:0">${editR ? '✏️ Edit Report' : (isTpl ? '📁 New Report from Template' : 'Report Builder')}</h2><div class="spacer"></div>
        ${editR ? '<button class="btn" id="bCancelEdit">Cancel Edit</button>' : ''}
      </div>
      <div class="form-grid">
        <div><label>Report Name</label><input type="text" id="bName" value="${esc(def.name || '')}" placeholder="e.g. Apple L4 Bin Storage Report"></div>
        <div><label>Report Type</label><select id="bType">${['Daily','Weekly','Monthly','Custom'].map(t => `<option ${(def.type || 'Daily') === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div><label>Data Source</label><select id="bSource"><option>Inventory</option></select></div>
        <div><label>Filter Field</label><select id="bFilterField"><option value="">— No filter —</option>${cols.map(c => `<option ${(def.filterField || '') === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <div><label>Filter Value</label><input type="text" id="bFilterValue" value="${esc(def.filterValue || '')}" placeholder="e.g. L4 / Bin Storage / SW93"></div>
        <div><label>Group By</label><select id="bGroup"><option value="">— None —</option>${['BRAND','CATEGORY','STATUS_BUCKET','AGE_BUCKET','LOCATION','BIN_BUCKET','PRIORITY'].map(c => `<option ${(def.groupBy || '') === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <div><label>Output Format</label><select id="bOutput">${['PDF','Excel','CSV','Google Sheet'].map(t => `<option ${(def.output || 'PDF') === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div><label>Orientation</label><select id="bOrientation">${['Portrait','Landscape'].map(t => `<option ${(def.orientation || 'Portrait') === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div><label>Summary Block</label><select id="bSummary">${['OFF','ON'].map(t => `<option ${(def.summary || 'OFF') === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div><label>Recipients</label><input type="text" id="bRecipients" value="${esc(def.recipients || '')}" placeholder="ops@example.com, mgr@example.com"></div>
        <div style="grid-column:1/-1"><label>Header Text (report ke upar)</label><input type="text" id="bHeader" value="${esc(def.headerText || '')}" placeholder="e.g. Quarterly L4 Devices Report"></div>
        <div style="grid-column:1/-1"><label>Footer Text (report ke neeche)</label><input type="text" id="bFooter" value="${esc(def.footerText || '')}" placeholder="e.g. Confidential — Internal Use Only"></div>
      </div>
      <label style="margin-top:12px">Fields (ctrl/cmd-click to select)</label>
      <div style="display:flex;gap:10px;align-items:center">
        <select id="bFields" multiple size="8" style="flex:1">${cols.map(c => {
        const sel = (def.columns || '').split(',').map(s => s.trim()).filter(Boolean);
        return `<option ${sel.indexOf(c) >= 0 ? 'selected' : ''}>${c}</option>`;
      }).join('')}</select>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn sm" id="bTplUpload">📤 Upload Template File</button>
          <input type="file" id="bTplFile" accept=".csv,.tsv,.txt" style="display:none">
          <p class="hint" style="max-width:200px">Upload a CSV/TSV template — its headers load into the fields (as the basis for your report).</p>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="bPreview">Preview Report</button>
        <button class="btn" id="bSaveTpl">💾 Save as Template</button>
        <button class="btn primary" id="bSave">${editR ? 'Update Report' : 'Save Report'}</button>
      </div>
      <div id="bOut"></div>
    </div>`;
  const fieldSel = () => Array.from($('#bFields').selectedOptions).map(o => o.value);
  const buildPreview = (into) => {
    const field = $('#bFilterField').value, val = $('#bFilterValue').value;
    const rows = field && val ? state.inventory.filter(x => String(x[field] || '').toLowerCase() === val.toLowerCase()) : state.inventory;
    const group = $('#bGroup').value;
    let display = rows;
    let groupNote = '';
    const sel = fieldSel();
    if (group) {
      const g = {};
      rows.forEach(r => { g[r[group]] = (g[r[group]] || 0) + 1; });
      groupNote = `<h3>Grouped by ${esc(group)}</h3>` + dataTable([{ label: group }, { label: 'Count', num: true }], Object.entries(g).map(([k, v]) => ({ cells: [esc(k), fmt(v)] })));
    }
    const headerRow = $('#bHeader').value.trim() ? `<div class="rpt-hdr"><strong>${esc($('#bHeader').value.trim())}</strong></div>` : '';
    const footerRow = $('#bFooter').value.trim() ? `<div class="rpt-ftr">${esc($('#bFooter').value.trim())}</div>` : '';
    const nameRow = `<h3 style="margin:6px 0">${esc($('#bName').value.trim() || 'Untitled Report')}</h3>`;
    const metaRow = `<p class="hint" style="margin:2px 0">${fmt(rows.length)} rows · ${esc($('#bOutput').value)} · ${esc($('#bType').value)}</p>`;
    into.innerHTML = `<div class="rpt-preview">${headerRow}${nameRow}${metaRow}${groupNote}<div style="overflow-x:auto">${dataTable(sel.map(o => ({ label: o })), display.slice(0, 8).map(r => ({ cells: sel.map(o => esc(r[o] ?? '')) })), { emptyMsg: 'No rows match this report filter.' })}</div>${footerRow}</div>`;
  };
  $('#bPreview').onclick = () => buildPreview($('#bOut'));
  // Live preview: update the preview immediately on any field change
  ['bName','bType','bFilterField','bFilterValue','bGroup','bOutput','bOrientation','bSummary','bHeader','bFooter','bFields'].forEach(id => {
    const node = document.getElementById(id);
    if (node) node.addEventListener('change', () => buildPreview($('#bOut')));
  });
  $('#bTplUpload').onclick = () => $('#bTplFile').click();
  $('#bTplFile').onchange = () => {
    const f = $('#bTplFile').files && $('#bTplFile').files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const text = String(reader.result);
        const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
        if (!lines.length) throw new Error('Template file empty.');
        const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toUpperCase().replace(/\s+/g, '_')).filter(Boolean);
        if (!headers.length) throw new Error('No headers found in the template file.');
        // Select headers that match inventory columns; add the rest as custom
        const known = cols;
        headers.forEach(h => {
          if (!known.includes(h) && !cols.includes(h)) { cols.push(h); MAPPING_TARGET_PRESETS && MAPPING_TARGET_PRESETS.push(h); }
        });
        $('#bFields').innerHTML = cols.map(c => {
          const on = headers.includes(c) || (def.columns || '').split(',').map(s => s.trim()).includes(c);
          return `<option ${on ? 'selected' : ''}>${c}</option>`;
        }).join('');
        toast('Template loaded — ' + headers.length + ' fields ready. Fill in the report name/filter and click Save.', 'ok');
        buildPreview($('#bOut'));
      } catch (e) { toast('Template parse error: ' + e.message, 'err'); }
    };
    reader.readAsText(f);
  };
  // initial preview agar template/edit mode ho
  if (tpl || editR) buildPreview($('#bOut'));
  $('#bSaveTpl').onclick = async () => {
    const name = await promptDlg('Save as Template', 'Template name', ($('#bName').value.trim() || 'Report') + ' Layout');
    if (!name) return;
    const cfg = {
      type: $('#bType').value, filterField: $('#bFilterField').value, filterValue: $('#bFilterValue').value,
      columns: fieldSel().join(','), output: $('#bOutput').value, recipients: $('#bRecipients').value.trim(),
      groupBy: $('#bGroup').value, headerText: $('#bHeader').value.trim(), footerText: $('#bFooter').value.trim(),
      orientation: $('#bOrientation').value, summary: $('#bSummary').value
    };
    if (api.isLive()) {
      try { await api.call('reports.templates.save', { name, configJson: JSON.stringify(cfg) }); toast('Template saved on backend.', 'ok'); } catch (e) { toast('Save failed: ' + e.message, 'err'); }
    } else {
      state.reportTemplates.push({ id: 'TPL' + String(state.reportTemplates.length + 1).padStart(3, '0'), name, config: cfg, active: 'ON' });
      state.audit.unshift({ ts: new Date().toISOString(), user: currentUser.email, action: 'TEMPLATE_SAVED', object: name, result: 'OK' });
      save(); toast('Template saved.', 'ok');
    }
  };
  $('#bSave').onclick = async () => {
    const name = $('#bName').value.trim();
    if (!name) { toast('Report name required.', 'err'); return; }
    const payload = {
      name,
      type: $('#bType').value, filterField: $('#bFilterField').value, filterValue: $('#bFilterValue').value,
      columns: fieldSel().join(','), output: $('#bOutput').value, recipients: $('#bRecipients').value.trim() || 'ops@example.com',
      groupBy: $('#bGroup').value, headerText: $('#bHeader').value.trim(), footerText: $('#bFooter').value.trim(),
      orientation: $('#bOrientation').value, summary: $('#bSummary').value, active: 'ON'
    };
    if (api.isLive()) {
      try {
        await api.call('reports.save', payload);
        await api.syncAll();
        toast('Report saved on backend.', 'ok'); navigate('reports');
      } catch (e) { toast('Save failed: ' + e.message, 'err'); }
      return;
    }
    if (editR) {
      Object.assign(editR, payload);
      state.audit.unshift({ ts: new Date().toISOString(), user: currentUser.email, action: 'REPORT_UPDATED', object: name, result: 'OK' });
    } else {
      state.reports.push({ id: 'RPT' + String(state.reports.length + 1).padStart(3, '0'), ...payload, schedule: payload.type });
      state.audit.unshift({ ts: new Date().toISOString(), user: currentUser.email, action: 'REPORT_CREATED', object: name, result: 'OK' });
    }
    builderEditId = null; builderTemplate = null;
    save(); toast('Report saved.', 'ok'); navigate('reports');
  };
  if (editIdx !== null && $('#bCancelEdit')) {
    $('#bCancelEdit').onclick = () => { builderEditId = null; builderTemplate = null; navigate('reports'); };
  }
}


/* Screens: Alerts, Trends, Labels+QR, Activity — appended into app.js (English UI copy) */
function screenAlerts(el) {
  el.innerHTML = `
    <div class="card">
      <div class="toolbar"><h2 style="margin:0">Stock Alerts</h2><div class="spacer"></div>
        <button class="btn" id="altCheck">⚡ Check Now</button>
        <button class="btn primary" id="altAdd">+ New Alert</button>
      </div>
      <p class="hint">Rules trigger when a count falls below (LT) or rises above (GT) its threshold. Notifications go out by email and Telegram.</p>
      ${dataTable(
        [{ label: 'Alert' }, { label: 'Filter' }, { label: 'Operator' }, { label: 'Threshold' }, { label: 'Email To' }, { label: 'Telegram' }, { label: 'Active' }, { label: 'Actions' }],
        state.alertRules.map((a, i) => ({ cells: [
          esc(a.name), esc(a.filterField + (a.filterValue ? ' = ' + a.filterValue : ' (all)')),
          badge(a.operator, 'b-info'), fmt(a.threshold), esc(a.emailTo || '—'),
          badge(a.telegram === 'ON' ? 'ON' : 'OFF', a.telegram === 'ON' ? 'b-ok' : 'b-gray'),
          badge(a.active, a.active === 'ON' ? 'b-ok' : 'b-gray'),
          `<button class="btn sm" data-edit="${i}">Edit</button> <button class="btn sm danger" data-del="${i}">✕</button>`
        ] }))
      )}
    </div>
    <div id="altOut"></div>`;
  $('#altAdd').onclick = () => alertModal(null);
  $$('[data-edit]', el).forEach(b => b.onclick = () => alertModal(state.alertRules[+b.dataset.edit]));
  $$('[data-del]', el).forEach(b => b.onclick = async () => {
    if (!roleGuard('ADMIN')) return;
    if (await confirmDlg('Delete alert', 'Delete this alert rule?', 'Delete', true)) {
      const a = state.alertRules[+b.dataset.del];
      if (api.isLive()) { try { await api.call('alerts.delete', { name: a.name }); await api.syncAll(); toast('Alert deleted on backend.', 'ok'); } catch (e) { toast(e.message, 'err'); } }
      else { state.alertRules.splice(+b.dataset.del, 1); save(); render(); }
    }
  });
  $('#altCheck').onclick = async () => {
    if (!roleGuard('OPERATOR')) return;
    $('#altOut').innerHTML = '<div class="card"><h2>Checking alerts…</h2><div class="progress"><div style="width:55%"></div></div></div>';
    let triggered = [];
    if (api.isLive()) {
      try { const r = await api.call('alerts.check'); triggered = r.triggered || []; } catch (e) { toast(e.message, 'err'); }
    } else {
      state.alertRules.forEach(a => {
        const rows = a.filterValue ? state.inventory.filter(x => String(x[a.filterField] || '').toLowerCase() === a.filterValue.toLowerCase()) : state.inventory;
        const count = rows.length;
        if ((a.operator === 'LT' && count < a.threshold) || (a.operator === 'GT' && count > a.threshold)) {
          triggered.push({ name: a.name, field: a.filterField, value: a.filterValue || '(all)', count, operator: a.operator, threshold: a.threshold, emailTo: a.emailTo, telegram: a.telegram === 'ON' });
        }
      });
    }
    $('#altOut').innerHTML = triggered.length
      ? `<div class="card"><h2>⚠️ ${triggered.length} alert(s) triggered</h2>${dataTable(
          [{ label: 'Alert' }, { label: 'Current' }, { label: 'Rule' }, { label: 'Notify' }],
          triggered.map(t => ({ cells: [esc(t.name), fmt(t.count), esc(t.operator + ' ' + t.threshold), esc((t.emailTo ? '📧 ' + t.emailTo : '') + (t.telegram ? ' • 📱 Telegram' : ''))] }))
        )}</div>`
      : '<div class="card"><h2>✅ No alerts triggered</h2><p class="hint">All stocks are within configured thresholds.</p></div>';
  };
}

function alertModal(rule) {
  const m = openModal(`

    <div class="form-grid">
      <div><label>Alert Name</label><input type="text" id="aName" value="${esc(rule?.name || '')}" placeholder="e.g. Apple Low Stock"></div>

      <div><label>Filter Value</label><input type="text" id="aValue" value="${esc(rule?.filterValue || '')}" placeholder="Apple (blank = all)"></div>
      <div><label>Operator</label><select id="aOp">${['LT','GT'].map(o => `<option ${(rule?.operator || 'LT') === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
      <div><label>Threshold</label><input type="number" id="aThreshold" value="${rule?.threshold ?? 10}" min="0"></div>

/* ────────────────────────── SCREEN: AGEING TRENDS ────────────────────────── */
function screenTrends(el) {
  const t = state.trends;
  const line = (key, color) => {
    if (!t.length) return emptyState('📈', 'No trend data', 'Run the daily process to build trend history.');
    const h = 160, w = 560;
    const data = t.slice();
    const max = Math.max(...data.map(p => p[key]), 1);
    const px = w / Math.max(data.length - 1, 1), py = h / max;
    const pts = data.map((p, i) => [30 + i * px, h - 14 - p[key] * py]);
    const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const dots = pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color}"><title>${esc(data[i].date)}: ${fmt(data[i][key])}</title></circle>`).join('');
    const labels = data.map((p, i) => (i % Math.ceil(data.length / 6) === 0 || i === data.length - 1) ? `<text x="${(30 + i * px).toFixed(1)}" y="${h - 2}" text-anchor="middle" class="chart-lbl">${esc(p.date.slice(5))}</text>` : '').join('');
    return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg" role="img" aria-label="Trend line"><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}</svg>`;
  };
  el.innerHTML = `
    <div class="card">
      <div class="toolbar"><h2 style="margin:0">Ageing Trends</h2><div class="spacer"></div><button class="btn" onclick="refreshAll()">↻ Refresh</button></div>
      <p class="hint">A snapshot of age buckets is saved after every daily run — see where your inventory is heading.</p>
      <div class="grid two">
        <div class="card"><h2>Below 30 days</h2>${line('below30', '#22c55e')}</div>
        <div class="card"><h2>30-60 days</h2>${line('m30', '#3b82f6')}</div>
        <div class="card"><h2>60-75 days</h2>${line('m60', '#f59e0b')}</div>
        <div class="card"><h2>Above 75 days</h2>${line('above75', '#ef4444')}</div>
      </div>
      <div class="card">
        <h2>Trend History</h2>
        ${dataTable(
          [{ label: 'Run' }, { label: 'Date' }, { label: 'Below 30', num: true }, { label: '30-60', num: true }, { label: '60-75', num: true }, { label: 'Above 75', num: true }, { label: 'Total', num: true }],
          t.slice().reverse().map(r => ({ cells: [esc(r.runId), esc(r.date), fmt(r.below30), fmt(r.m30), fmt(r.m60), fmt(r.above75), fmt(r.total)] }))
        )}
      </div>
    </div>`;
}

function exportCSV(name, columns, rows) {
  const cols = typeof columns === 'string' ? columns.split(',') : columns;
  const header = cols.join(',');
  const lines = rows.map(r => cols.map(c => `"${String(r[c] ?? '').replace(/"/g, '""')}"`).join(','));
  const blob = new Blob([header + '\n' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name.replace(/\s+/g, '_') + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('CSV exported: ' + a.download, 'ok');
  return a.download;
}

              : `<button class="btn sm" data-lock="${i}">Lock</button>`;
          return { cells: [esc(s.sheet), badge(s.mode, s.mode === 'LOCKED' ? 'b-err' : s.mode === 'PARTIAL' ? 'b-warn' : 'b-ok'), status, esc(s.adminUnlock), esc(s.autoRelock), actions] };
        })
      )}
    </div>`;
  $$('[data-unlock]', el).forEach(b => b.onclick = async () => {
    if (!roleGuard('ADMIN')) return;
    const s = state.security[+b.dataset.unlock];
    if (s.adminUnlock === 'NO') { toast('This sheet does not allow admin unlock.', 'err'); return; }
    if (await confirmDlg('Unlock sheet', `Unlock "${s.sheet}"? The action is logged.`, 'Unlock')) {
      if (api.isLive()) {
        b.disabled = true; b.innerHTML = '⏳';
        try {
          await api.call('security.unlock', { sheet: s.sheet });
          await api.syncAll();
          toast('Sheet unlocked on backend.', 'ok');
        } catch (e) { toast('Unlock failed: ' + e.message, 'err'); }
        b.disabled = false; b.innerHTML = 'Unlock';
      } else {
        s.status = 'UNLOCKED'; state.audit.unshift({ ts: new Date().toISOString(), user: currentUser.email, action: 'SHEET_UNLOCKED', object: s.sheet, result: 'OK' });
        save(); toast('Sheet unlocked (auto-relock: ' + s.autoRelock + ').', 'ok');
      }
      render();
    }
  });
  $$('[data-lock]', el).forEach(b => b.onclick = async () => {
    if (!roleGuard('ADMIN')) return;
    const s = state.security[+b.dataset.lock];
    if (api.isLive()) {
      b.disabled = true; b.innerHTML = '⏳';
      try {
        await api.call('security.lock', { sheet: s.sheet });
        await api.syncAll();
        toast('Sheet locked on backend.', 'ok');
      } catch (e) { toast('Lock failed: ' + e.message, 'err'); }
      b.disabled = false; b.innerHTML = 'Lock';
    } else {
      s.status = 'LOCKED'; state.audit.unshift({ ts: new Date().toISOString(), user: currentUser.email, action: 'SHEET_RELOCKED', object: s.sheet, result: 'OK' });
      save(); toast('Sheet locked.', 'ok');
    }
    render();
  });
  $('#lockAll').onclick = async () => {
    if (!roleGuard('ADMIN')) return;
    if (api.isLive()) {
      const btn = $('#lockAll');
      btn.disabled = true; btn.innerHTML = '⏳ Locking…';
      try {
        for (const s of state.security) {
          if (s.mode !== 'OPEN') { try { await api.call('security.lock', { sheet: s.sheet }); } catch (e) { /* per-sheet error logged below */ } }
        }
        await api.syncAll();
        toast('All protected sheets locked on backend.', 'ok');
      } catch (e) { toast('Lock all failed: ' + e.message, 'err'); }
      btn.disabled = false; btn.innerHTML = '🔒 Lock All';
    } else {
      state.security.forEach(s => { if (s.mode !== 'OPEN') s.status = 'LOCKED'; });
      state.audit.unshift({ ts: new Date().toISOString(), user: currentUser.email, action: 'LOCK_ALL', object: 'system', result: 'OK' });
      save(); toast('All protected sheets locked.', 'ok');
    }
    render();
  };
}

/* ────────────────────────── SCREEN: AI COMMAND CENTER ────────────────────────── */
const AI_KEYWORDS = [
  { kw: 'inventory', action: 'RUN_INVENTORY', label: 'Run inventory pipeline' },
  { kw: 'update', action: 'RUN_INVENTORY', label: 'Update inventory' },
  { kw: 'report', action: 'RUN_REPORT', label: 'Generate report' },
  { kw: 'email', action: 'RUN_EMAIL', label: 'Email reports' },
  { kw: 'bin', action: 'BIN_REPORT', label: 'Bin storage report' },
  { kw: 'bucket', action: 'BUCKET_REPORT', label: 'Bucket report' },
  { kw: 'pivot', action: 'RUN_PIVOT', label: 'Refresh pivot' },
  { kw: 'status', action: 'SYSTEM_STATUS', label: 'System status' }
];

function interpretAI(text) {
  const t = text.toLowerCase();
  const actions = AI_KEYWORDS.filter(k => t.includes(k.kw)).map(k => k.action);
  const filters = {};
  const ageM = t.match(/(\d+)\s*(days|din|दिन)/);
  if (ageM) filters.minAge = +ageM[1];
  const brandM = t.match(/(apple|android|samsung|oneplus|xiaomi|realme|vivo|oppo)/);
  if (brandM) filters.brand = brandM[1];
  const locM = t.match(/(sw\d{2,3})/i);
  if (locM) filters.location = locM[1].toUpperCase();
  const statusM = t.match(/(l[0-9]|bin\s*storage|pending|marked)/);
  if (statusM) filters.status = statusM[1];
  return { actions: [...new Set(actions)], filters, raw: text };
}

function screenAI(el) {
  el.innerHTML = `
    <div class="card">
      <h2>AI Command Center</h2>
      <p class="hint">Type a command in English or Hindi. The system interprets it, shows the structured action, and executes through the Rules Engine — never bypassing business rules or permissions.</p>
      <label for="aiInput">Command</label>
      <input type="text" id="aiInput" placeholder='e.g. "आज की inventory बना दो" or "75 days से ऊपर वाले Apple devices की report बनाओ"'>
      <div class="btn-row">
        <button class="btn primary" id="aiInterpret">Interpret</button>
        <button class="btn" id="aiClear">Clear</button>
      </div>
      <div class="btn-row" style="margin-top:6px">
        <button class="btn sm" data-sample="आज की inventory बना दो">📋 आज की inventory बना दो</button>
        <button class="btn sm" data-sample="आज QC Stock से inventory update करो">📋 QC Stock से update</button>
        <button class="btn sm" data-sample="Apple L4 के Bin Storage devices की report बनाओ">📋 Apple L4 Bin report</button>
        <button class="btn sm" data-sample="75 days से ऊपर वाले devices निकालो">📋 75 days+ devices</button>
        <button class="btn sm" data-sample="SW93 के devices की bucket report बनाओ">📋 SW93 bucket report</button>
      </div>
      <div id="aiOut"></div>
    </div>`;
  const out = $('#aiOut');
  $$('[data-sample]', el).forEach(b => b.onclick = () => { $('#aiInput').value = b.dataset.sample; interpret(); });
  const interpret = () => {
    const text = $('#aiInput').value.trim();
    if (!text) { toast('Enter a command first.', 'warn'); return; }
    const parsed = interpretAI(text);
    if (!parsed.actions.length) { out.innerHTML = `<div class="card"><h3>Not recognized</h3><p class="hint">No known action found. Try: inventory, report, email, bin, bucket, pivot, status.</p></div>`; return; }
    out.innerHTML = `
      <div class="card">
        <h3>AI Interpretation</h3>
        <div class="health-row"><span class="hdot h-ok"></span><strong>User:</strong> ${esc(text)}</div>
        <div class="health-row"><span class="hdot h-info"></span><strong>Actions:</strong> ${parsed.actions.map(a => esc(a)).join(', ') || '—'}</div>
        <div class="health-row"><span class="hdot h-info"></span><strong>Filters:</strong> ${Object.keys(parsed.filters).length ? esc(JSON.stringify(parsed.filters)) : 'none'}</div>
        <p class="hint">Executed via the configured Rules Engine — age buckets, status mappings and bin rules apply from configuration.</p>
        <div class="btn-row">
          <button class="btn primary" id="aiRun">Run</button>
          <button class="btn" id="aiCancel">Cancel</button>
        </div>
      </div>`;
    $('#aiRun').onclick = () => {
      const p = parsed;
      let msg = '';
      if (p.actions.includes('RUN_INVENTORY')) { runPipelineUI(); msg = 'Inventory pipeline executed.'; }
      if (p.actions.includes('RUN_REPORT')) { msg += ' Report generated.'; }
      if (p.filters.location && p.actions.includes('BUCKET_REPORT')) { invFilters.location = p.filters.location; navigate('inventory'); msg = `Filtered inventory to location ${p.filters.location}.`; }
      if (p.filters.minAge) { invFilters.age = p.filters.minAge >= 75 ? 'Above 75' : p.filters.minAge >= 60 ? '60-75' : p.filters.minAge >= 30 ? '30-60' : 'Below 30'; navigate('inventory'); msg = `Filtered inventory to age bucket for ${p.filters.minAge}+ days.`; }
      state.audit.unshift({ ts: new Date().toISOString(), user: currentUser.email, action: 'AI_COMMAND', object: p.raw, result: 'OK' });
      save();
      if (!msg) { toast('Command executed.', 'ok'); render(); } else { toast(msg, 'ok'); }
      out.innerHTML = '';
    };
    $('#aiCancel').onclick = () => { out.innerHTML = ''; };
  };
  $('#aiInterpret').onclick = interpret;
  $('#aiInput').addEventListener('keydown', e => { if (e.key === 'Enter') interpret(); });
  $('#aiClear').onclick = () => { $('#aiInput').value = ''; out.innerHTML = ''; };
}

    $('#sBkOut').innerHTML = '<p class="hint">Backup in progress…</p>';
    try {
      await api.call('settings.save', { settings: { AUTO_BACKUP: $('#sBackup').value, BACKUP_FOLDER_ID: $('#sBkFolder').value.trim() } });
      state.systemSettings.AUTO_BACKUP = $('#sBackup').value; state.systemSettings.BACKUP_FOLDER_ID = $('#sBkFolder').value.trim(); save();
      if (api.isLive()) {
        const r = await api.call('backup.run');
        $('#sBkOut').innerHTML = r.error ? '<p class="hint">❌ ' + esc(r.error) + '</p>' : '<p class="hint">✅ Backup created: ' + esc(r.name) + ' (Drive)</p>';
      } else {
        $('#sBkOut').innerHTML = '<p class="hint">Demo mode: backup settings saved. In live mode a Drive copy is created.</p>';
      }
      toast('Backup settings saved.', 'ok');
    } catch (e) { $('#sBkOut').innerHTML = '<p class="hint">' + esc(e.message) + '</p>'; }
  };
}
