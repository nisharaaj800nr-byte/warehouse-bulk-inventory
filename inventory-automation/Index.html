<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Google-native Control Center (single file for Apps Script HtmlService) -->
<title>Bulk Repair — Control Center</title>
<meta name="description" content="Configurable inventory automation platform: dashboard, import, field mapping, rules, reports, schedules, security, AI command center.">
<style>
/* Bulk Repair — Control Center styles */
:root{
  --bg:#f2f5f9; --panel:#ffffff; --ink:#1c2733; --muted:#6b7a8c;
  --brand:#1F4E79; --brand2:#2e75b6; --line:#e3e9f0;
  --ok:#1e8e3e; --warn:#b26a00; --err:#c5221f; --info:#1a73e8;
  --radius:10px; --shadow:0 1px 3px rgba(16,32,54,.08),0 4px 14px rgba(16,32,54,.06);
  --th-bg:#f7fafc; --th-fg:#46586b; --row-hover:#f4f8fc;
  --input-bg:#ffffff; --input-border:#cfd9e4;
  --progress-bg:#e8eef5; --chip-bg:#eef3f8;
  --code-bg:#0f1c2a; --code-fg:#d7e4f2;
  --badge-gray-bg:#eef1f4; --badge-gray-fg:#5f6f80;
  --btn-hover:#f2f6fa;
}
[data-theme="dark"]{
  --bg:#0d1520; --panel:#16202e; --ink:#dbe6f2; --muted:#8ba0b5;
  --brand:#3d8bd6; --brand2:#5ea2e0; --line:#243446;
  --ok:#4caf7d; --warn:#e0a63d; --err:#ef6a67; --info:#5aa8f5;
  --shadow:0 1px 3px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.3);
  --th-bg:#1b2735; --th-fg:#9db2c7; --row-hover:#1c2a3a;
  --input-bg:#0f1a26; --input-border:#2c3d52;
  --progress-bg:#223041; --chip-bg:#1d2b3b;
  --code-bg:#0a1119; --code-fg:#c9d9ea;
  --badge-gray-bg:#223041; --badge-gray-fg:#a7b8ca;
  --btn-hover:#1d2b3b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
#app{display:flex;height:100vh;overflow:hidden}
/* ── Sidebar ── */
#sidebar{width:248px;min-width:248px;background:#14283c;color:#dbe6f2;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,#2e75b6,#1F4E79);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text strong{font-size:14px;color:#fff}
.brand-text span{font-size:11px;color:#8fa7bd}
#nav{flex:1;overflow-y:auto;padding:10px 8px}
#nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:2px 0;border-radius:8px;color:#b9cbdc;text-decoration:none;font-size:13.5px;transition:background .15s,color .15s}
#nav a:hover{background:rgba(255,255,255,.07);color:#fff}
#nav a.active{background:var(--brand2);color:#fff;font-weight:600}
#nav a .ico{width:18px;text-align:center;font-size:15px}
#nav .nav-sep{height:1px;background:rgba(255,255,255,.08);margin:8px 10px}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.conn-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.4px;margin-bottom:10px}
.conn-badge .dot{width:8px;height:8px;border-radius:50%}
.conn-badge.demo{background:rgba(255,193,7,.15);color:#ffd75e}
.conn-badge.demo .dot{background:#ffc107}
.conn-badge.live{background:rgba(30,142,62,.18);color:#7ee2a0}
.conn-badge.live .dot{background:#34c759}
.conn-badge.off{background:rgba(197,33,31,.15);color:#ff9d9a}
.conn-badge.off .dot{background:#c5221f}
.user-chip{display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#34c759,#1e8e3e);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.user-chip>div:last-child{line-height:1.25}
.user-chip>div:last-child>div:first-child{font-size:13px;color:#fff}
.role-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;color:#ffd75e}
/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
#topbar h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;align-items:center;gap:12px}
.clock{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;font-size:16px;cursor:pointer;color:var(--ink);display:none}
#content{flex:1;overflow-y:auto;padding:22px;scroll-behavior:smooth}
/* ── Cards / grids ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.card h2{margin:0 0 14px;font-size:15px;color:var(--brand)}
.card h3{margin:0 0 10px;font-size:13.5px}
.grid{display:grid;gap:14px}
.grid.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.grid.two{grid-template-columns:1fr 1fr}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;position:relative;overflow:hidden}
.kpi .k-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi .k-value{font-size:26px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.kpi.k-err .k-value{color:var(--err)} .kpi.k-ok .k-value{color:var(--ok)} .kpi.k-warn .k-value{color:var(--warn)} .kpi.k-info .k-value{color:var(--info)}
/* ── Tables ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--th-bg);color:var(--th-fg);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0}
tbody tr:hover{background:var(--row-hover)}
tr.clickable{cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.center,th.center{text-align:center}
.tbl-empty{padding:26px;text-align:center;color:var(--muted)}
/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-ok{background:#e6f4ea;color:var(--ok)} .b-err{background:#fce8e6;color:var(--err)}
.b-warn{background:#fef7e0;color:var(--warn)} .b-info{background:#e8f0fe;color:var(--info)}
.b-gray{background:var(--badge-gray-bg);color:var(--badge-gray-fg)} .b-brand{background:#e3edf7;color:var(--brand)}
[data-theme="dark"] .b-brand{background:#1d3550;color:#7fb4e8}
[data-theme="dark"] .b-ok{background:#123324;color:#6fd39a}
[data-theme="dark"] .b-err{background:#3a1c1b;color:#f09390}
[data-theme="dark"] .b-warn{background:#3a2c10;color:#f0c168}
[data-theme="dark"] .b-info{background:#14283f;color:#7db4f0}
/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--btn-hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#173c5e}
.btn.danger{background:#fff;border-color:#e6b4b2;color:var(--err)}
.btn.danger:hover{background:#fce8e6}
.btn.ok{background:#fff;border-color:#b7e0c3;color:var(--ok)}
.btn.ok:hover{background:#e6f4ea}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* ── Forms ── */
label{display:block;font-size:12px;font-weight:600;color:#46586b;margin:10px 0 5px}
input[type=text],input[type=email],input[type=number],input[type=time],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--input-border);border-radius:8px;font-size:13px;background:var(--input-bg);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd6ee;border-color:var(--brand2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
/* ── Modal ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,28,42,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px}
.modal{background:var(--panel);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:min(620px,96vw);max-height:88vh;display:flex;flex-direction:column}
.modal.wide{width:min(880px,96vw)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:15px}
.modal-body{padding:16px 18px;overflow-y:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
/* ── Drawer ── */
.drawer-backdrop{position:fixed;inset:0;background:rgba(15,28,42,.35);z-index:55}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,94vw);background:var(--panel);z-index:56;box-shadow:-8px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translateX(0);animation:slideIn .18s ease-out}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer-head h3{margin:0;font-size:15px}
.drawer-body{padding:16px 18px;overflow-y:auto;flex:1}
.drawer dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:0;font-size:13px}
.drawer dt{color:var(--muted);font-weight:600}
.drawer dd{margin:0;word-break:break-word}
/* ── Toasts ── */
#toastRoot{position:fixed;top:16px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border-left:4px solid var(--info);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:11px 14px;min-width:260px;max-width:380px;font-size:13px;animation:toastIn .2s ease-out}
.toast.t-ok{border-color:var(--ok)} .toast.t-err{border-color:var(--err)} .toast.t-warn{border-color:var(--warn)}
@keyframes toastIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
/* ── Tabs ── */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border:1px solid transparent;border-bottom:none}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--panel);color:var(--brand);border-color:var(--line)}
/* ── Misc ── */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .spacer{flex:1}
.search{position:relative;min-width:220px}
.search input{padding-left:30px}
.search::before{content:"🔍";position:absolute;left:9px;top:8px;font-size:12px;opacity:.7}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{width:auto;min-width:130px}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;font-size:12.5px;color:var(--muted)}
.health-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:13px}
.health-row:last-child{border-bottom:none}
.hdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.hdot.h-ok{background:var(--ok)} .hdot.h-warn{background:var(--warn)} .hdot.h-err{background:var(--err)}
.mono{font-family:Consolas,Menlo,monospace;font-size:12px}
pre.code{background:var(--code-bg);color:var(--code-fg);padding:14px;border-radius:8px;overflow-x:auto;font-size:12px;line-height:1.5}
.progress{height:8px;background:var(--progress-bg);border-radius:6px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:6px;transition:width .4s}
.empty-state{text-align:center;padding:40px 16px;color:var(--muted)}
.empty-state .big{font-size:38px;margin-bottom:8px}
.help-block{margin-bottom:18px}
.help-block h3{color:var(--brand);margin-bottom:6px}
.help-block ul{margin:6px 0;padding-left:20px;line-height:1.7}
.keyword{display:inline-block;background:var(--chip-bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;font-family:Consolas,monospace}
/* ── Theme toggle ── */
.theme-btn{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:36px;font-size:16px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.theme-btn:hover{background:var(--btn-hover)}
[data-theme="dark"] #topbar{background:var(--panel)}
/* ── Responsive ── */
@media(max-width:1024px){
  .grid.two,.grid.three{grid-template-columns:1fr}
}
@media(max-width:860px){
  #sidebar{position:fixed;z-index:70;transform:translateX(-100%);transition:transform .2s;box-shadow:6px 0 24px rgba(0,0,0,.2)}
  #sidebar.open{transform:translateX(0)}
  #main{width:100%}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center}
  .form-grid{grid-template-columns:1fr}
  .clock{display:none}
  #content{padding:14px}
  .kpi .k-value{font-size:21px}
}
/* ── Mobile enhancements ── */
#sideBackdrop{display:none}
@media(max-width:860px){
  #sidebar{width:min(300px,86vw)}
  #sideBackdrop{display:block;position:fixed;inset:0;background:rgba(15,28,42,.45);z-index:69;opacity:0;pointer-events:none;transition:opacity .2s}
  #sideBackdrop.show{opacity:1;pointer-events:auto}
  .toolbar{flex-wrap:wrap}
  .toolbar .btn,.btn-row .btn{flex:1 1 auto}
  .filters{width:100%}
  .filters select{flex:1 1 calc(50% - 4px);min-width:0}
  .search{min-width:0;width:100%}
  .modal{width:min(640px,96vw);max-height:88vh;overflow-y:auto}
  .drawer{width:100vw}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{flex:0 0 auto}
  .label-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .pager{flex-wrap:wrap;justify-content:flex-start}
  .topbar-actions{gap:6px}
  #runBtn{padding:7px 10px;font-size:12px}
  #pageTitle{font-size:17px}
  .btn.sm{padding:5px 9px;font-size:12px}
  .tbl-wrap{-webkit-overflow-scrolling:touch}
}
@media(max-width:480px){
  #content{padding:10px}
  .card{padding:12px}
  .filters select{flex:1 1 100%}
  .toolbar .btn{font-size:12px;padding:7px 9px}
  .modal{width:100vw;max-height:92vh;border-radius:0}
  .modal-backdrop{display:flex;align-items:flex-end}
  .chart-row svg{max-width:100%}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .qrcard .qr-img{width:110px;height:110px}
  th,td{padding:7px 8px;font-size:12.5px}
  .label-grid{grid-template-columns:repeat(2,1fr)}
  .drawer-head h3{font-size:15px}
}
/* Scrollbars in dark mode */
[data-theme="dark"] ::-webkit-scrollbar{width:10px;height:10px}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#2c3d52;border-radius:6px}
[data-theme="dark"] ::-webkit-scrollbar-track{background:transparent}
/* ── SVG Charts ── */
.chart-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chart-row svg{max-width:220px;width:100%;height:auto}
.chart-svg{width:100%;height:auto;max-width:560px}
.chart-val{font-size:10px;fill:#667085}
[data-theme="dark"] .chart-val{fill:#9aa7b8}
.chart-lbl{font-size:9px;fill:#667085}
[data-theme="dark"] .chart-lbl{fill:#9aa7b8}
.chart-center-n{font-size:22px;font-weight:700;fill:#0f172a}
[data-theme="dark"] .chart-center-n{fill:#e6edf5}
.chart-center-l{font-size:10px;fill:#667085}
.chart-legend{flex:1;min-width:180px}
.lg-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px solid rgba(15,23,42,.06)}
[data-theme="dark"] .lg-item{border-bottom-color:rgba(255,255,255,.07)}
.lg-swatch{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.lg-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-item strong{font-variant-numeric:tabular-nums}
.lg-pct{color:#667085;font-size:11px;min-width:38px;text-align:right}
/* ── QR Labels ── */
.label-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin:12px 0}
.qrcard{border:1px solid rgba(15,23,42,.12);border-radius:10px;padding:14px;text-align:center;background:#fff;break-inside:avoid}
[data-theme="dark"] .qrcard{border-color:rgba(255,255,255,.12);background:#16202e}
.qrcard .qr-img{width:140px;height:140px;margin:10px auto;display:flex;align-items:center;justify-content:center}
.qrcard .qr-img svg{width:100%;height:100%}
.qrcard.big .qr-img{width:200px;height:200px}
.qrcard.big.small{max-width:220px;margin:0 auto}
.qrcard.big.large .qr-img{width:260px;height:260px}
@media print{
  .qrcard{box-shadow:none}
  .label-grid{grid-template-columns:repeat(3,1fr)}
}
@media print{
  #sidebar,#topbar,.toolbar,.btn-row{display:none !important}
  #content{padding:0}
  .card{box-shadow:none;border:none}
}
.err-strip{background:#fdecea;border:1px solid #f5c6c2;border-left:5px solid var(--err,#c5221f);color:#8c1d1a;border-radius:var(--radius,10px);padding:12px 16px;margin-bottom:16px;font-size:13.5px;line-height:1.5}
[data-theme="dark"] .err-strip{background:#3a1d1c;border-color:#6b322f;color:#ffd7d4}
.lb-chk{display:block;font-size:11px;color:var(--muted,#6b7a8c);text-align:left;margin-bottom:6px}
.code-text{font-family:'Courier New',monospace;font-size:20px;font-weight:700;letter-spacing:2px;padding:12px 6px;text-align:center;color:var(--ink,#1c2733);border:1px dashed var(--line,#e3e9f0);border-radius:6px;margin:8px auto;max-width:90%}
[data-theme="dark"] .code-text{color:#dbe6f2;border-color:#2c3d52}
.rpt-preview{border:1px solid var(--line,#e3e9f0);border-radius:8px;padding:14px;margin-top:12px;background:var(--panel,#fff)}
.rpt-hdr{font-size:14px;color:var(--brand,#1F4E79);margin-bottom:4px}
.rpt-ftr{font-size:11px;color:var(--muted,#6b7a8c);margin-top:8px;border-top:1px solid var(--line,#e3e9f0);padding-top:6px}

/* ── Universal Import (v2) ── */
.imp-drop {
  border: 2px dashed var(--bd, #c3ccd6);
  border-radius: 12px;
  padding: 28px 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  background: var(--bg2, rgba(0,0,0,.02));
  margin: 10px 0;
}
.imp-drop.drag { border-color: var(--acc, #2563eb); background: var(--acc-soft, rgba(37,99,235,.08)); }
.imp-drop-icon { font-size: 34px; line-height: 1; margin-bottom: 8px; }
.imp-drop-title { font-size: 15px; margin-bottom: 6px; }
.imp-formats { margin-top: 10px; letter-spacing: .3px; }
.imp-or { display: flex; align-items: center; gap: 12px; color: var(--mut, #8a97a8); margin: 12px 0 8px; font-size: 13px; }
.imp-or::before, .imp-or::after { content: ''; flex: 1; height: 1px; background: var(--bd, #dde3ea); }
.imp-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip {
  border: 1px solid var(--bd, #c3ccd6);
  background: var(--bg2, rgba(0,0,0,.03));
  border-radius: 16px;
  padding: 4px 12px;

<script>
/* ============================================================
   Bulk Repair — Control Center (SPA)
   Vanilla JS, no dependencies. Works in DEMO mode out of the box;
   connect a Google Apps Script Web App URL in Settings for LIVE mode.
   ============================================================ */
'use strict';

/* ── Global error visibility: never a silent blank screen ── */
(function () {
  function errBanner(msg) {
    try {
      let b = document.getElementById('errBanner');
      if (!b) {
        b = document.createElement('div');
        b.id = 'errBanner';
        b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#c5221f;color:#fff;padding:10px 14px;font:13px/1.5 "Segoe UI",Arial,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35);white-space:pre-wrap';
        document.body.appendChild(b);
      }
      b.textContent = '⚠️ ' + msg;
      b.style.display = 'block';
    } catch (e) { /* ignore */ }
  }
  window.addEventListener('error', function (ev) {
    errBanner('Script error: ' + (ev.message || 'unknown') + (ev.filename ? ' @ ' + String(ev.filename).split('/').pop() + ':' + ev.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (ev) {
    var r = ev.reason;
    errBanner('Backend error: ' + ((r && r.message) ? r.message : String(r)));
  });
})();

/* ============================================================
   QR Code generator (compact, self-contained, no dependencies)
   ============================================================ */
/* Compact QR Code encoder (byte mode, versions 1-10, ECC L/M/Q/H)
   Self-contained, no dependencies. Written for the Inventory Control
   Center label printing. MIT-style: use freely.
   Algorithm follows ISO/IEC 18004 structure (GF(256), Reed-Solomon,
   mask patterns, format/version info). */

const QR = (() => {
  // GF(256) tables
  const EXP = new Array(512), LOG = new Array(256);
  (() => {
    let x = 1;
    for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  const gmul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];

  const ECC = { L: 1, M: 0, Q: 3, H: 2 }; // format bits
  // version -> [ecCodewordsPerBlock, numBlocks] for each ECC level (L,M,Q,H)
  const TAB = {
    1:  { L: [7, 1], M: [10, 1], Q: [13, 1], H: [17, 1] },
    2:  { L: [10, 1], M: [16, 1], Q: [22, 1], H: [28, 1] },
    3:  { L: [15, 1], M: [26, 1], Q: [18, 2], H: [22, 2] },
    4:  { L: [20, 1], M: [18, 2], Q: [26, 2], H: [16, 4] },
    5:  { L: [26, 1], M: [24, 2], Q: [18, 2], H: [22, 4] },
    6:  { L: [18, 2], M: [16, 4], Q: [24, 4], H: [28, 4] },
    7:  { L: [20, 2], M: [18, 4], Q: [18, 6], H: [26, 5] },
    8:  { L: [24, 2], M: [22, 4], Q: [22, 6], H: [26, 6] },
    9:  { L: [30, 2], M: [22, 4], Q: [20, 8], H: [24, 8] },
    10: { L: [18, 2], M: [26, 4], Q: [24, 8], H: [28, 8] }
  };
  const CAP = { // data codewords per version (L,M,Q,H)
    1: { L: 19, M: 16, Q: 13, H: 9 }, 2: { L: 34, M: 28, Q: 22, H: 16 },
    3: { L: 55, M: 44, Q: 34, H: 26 }, 4: { L: 80, M: 64, Q: 48, H: 36 },
    5: { L: 108, M: 86, Q: 62, H: 46 }, 6: { L: 136, M: 108, Q: 76, H: 60 },
    7: { L: 156, M: 124, Q: 88, H: 66 }, 8: { L: 194, M: 154, Q: 110, H: 86 },
    9: { L: 232, M: 182, Q: 132, H: 100 }, 10: { L: 274, M: 216, Q: 154, H: 122 }
  };

  function rsGen(ecLen) { // generator polynomial
    let poly = [1];
    for (let i = 0; i < ecLen; i++) {
      const np = new Array(poly.length + 1).fill(0);
      for (let j = 0; j < poly.length; j++) {
        np[j] ^= gmul(poly[j], EXP[i]);
        np[j + 1] ^= poly[j];
      }
      poly = np;
    }
    return poly.slice(0, poly.length - 1); // drop leading 0 coefficient? keep full
  }

  function rsRemainder(data, ecLen) {
    const gen = rsGen(ecLen);
    // gen length = ecLen+1 (including leading coefficient 1 at index 0)
    let rem = new Array(ecLen).fill(0);
    for (const d of data) {
      const factor = d ^ rem[0];
      rem.shift();
      rem.push(0);
      for (let i = 0; i < ecLen; i++) {
        rem[i] ^= gmul(gen[i + 1], factor);
      }
    }
    return rem;
  }

  function encode(text, ecl = 'M') {
    const bytes = [];
    for (let i = 0; i < text.length; i++) {
      let c = text.charCodeAt(i);
      if (c > 0xff) { bytes.push(0x3f); continue; } // non-latin -> '?'
      bytes.push(c);
    }
    // choose version
    let version = 1;
    while (version <= 10) {
      const cap = CAP[version][ecl];
      const needed = 4 + (bytes.length <= 255 ? 8 : 16) + bytes.length * 8;
      if (needed <= cap * 8) break;
      version++;
    }
    if (version > 10) { bytes.length = 10 * 8; version = 10; }
    // build data bitstream
    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
    push(4, 4); // byte mode
    push(bytes.length, bytes.length <= 255 ? 8 : 16);
    for (const b of bytes) push(b, 8);
    const dataCap = CAP[version][ecl] * 8;
    while (bits.length < dataCap) bits.push(1);
    while (bits.length % 8 !== 0) bits.push(0);
    // pad
    const pad = [0xec, 0x11];
    let pi = 0;
    while (bits.length < dataCap) { push(pad[pi++ % 2], 8); }
    // to codewords
    const dataWords = [];
    for (let i = 0; i < bits.length; i += 8) {
      let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
      dataWords.push(v);
    }
    // split into blocks, add EC
    const [ecLen, nBlocks] = TAB[version][ecl];
    const totalData = CAP[version][ecl];
    const shortLen = Math.floor(totalData / nBlocks);
    const numLong = totalData % nBlocks;
    const blocks = [];
    let pos = 0;
    for (let b = 0; b < nBlocks; b++) {
      const len = shortLen + (b < numLong ? 1 : 0);
      const blk = dataWords.slice(pos, pos + len);
      pos += len;
      const ec = rsRemainder(blk, ecLen);
      blocks.push({ data: blk, ec });
    }
    // interleave
    const out = [];
    const maxLen = shortLen + (numLong ? 1 : 0);
    for (let i = 0; i < maxLen; i++) {
      for (const b of blocks) if (i < b.data.length) out.push(b.data[i]);
    }
    for (let i = 0; i < ecLen; i++) for (const b of blocks) out.push(b.ec[i]);
    return { version, words: out, ecl, ecLen };
  }

  const FORMAT_BITS = (() => {
    const map = {};
    // data = ecl(2)<<3 | mask(3); BCH(15,5) with poly 0x537
    for (let data = 0; data < 32; data++) {
      let rem = data << 10;
      for (let i = 14; i >= 10; i--) if ((rem >> i) & 1) rem ^= 0x537 << (i - 10);
      const bits15 = ((data << 10) | rem) ^ 0x5412;
      map[data] = bits15;
    }
    return map;
  })();

  function buildMatrix(version, words, ecl, mask) {
    const size = version * 4 + 17;
    const m = Array.from({ length: size }, () => new Array(size).fill(0)); // 0=none,1=dark
    const set = (x, y, v) => { if (x >= 0 && x < size && y >= 0 && y < size) m[y][x] = v ? 1 : 0; };
    // finder patterns
    const finder = (cx, cy) => {
      for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
        const dark = (r >= 0 && r <= 6 && c >= 0 && c <= 6) && (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4));
        set(cx + c, cy + r, dark);
      }
    };
    finder(0, 0); finder(size - 7, 0); finder(0, size - 7);
    // separators
    for (let i = -1; i <= 7; i++) {
      set(i, 7, 0); set(7, i, 0); set(size - 8, i, 0); set(i, size - 8, 0);
      set(size - 1 - i, 7, 0); set(7, size - 1 - i, 0);
    }
    // timing
    for (let i = 8; i < size - 8; i++) { set(i, 6, i % 2 === 0); set(6, i, i % 2 === 0); }
    // dark module
    set(8, size - 8, 1);
    // alignment (only versions >= 2)
    if (version >= 2) {
      const positions = [];
      const step = version >= 7 ? 6 : (version >= 4 ? 5 : 4);
      for (let p = 8; p <= size - 9; p += step) positions.push(p);
      if (positions[positions.length - 1] !== size - 9) positions.push(size - 9);
      positions.unshift(6);
      const align = (cx, cy) => {
        if ((cx === 6 && cy === 6) || (cx === 6 && cy === size - 7) || (cx === size - 7 && cy === 6)) return;
        for (let r = -2; r <= 2; r++) for (let c = -2; c <= 2; c++) {
          set(cx + c, cy + r, Math.max(Math.abs(r), Math.abs(c)) !== 1);
        }
      };
      for (const cy of positions) for (const cx of positions) align(cx, cy);
    }
    // format info (two copies) — placeholder, applied with mask later
    // reserve format areas, fill after mask selection
    // data placement
    const formatData = FORMAT_BITS[((ecl === 'L' ? 1 : ecl === 'M' ? 0 : ecl === 'Q' ? 3 : 2) << 3) | mask];
    let dir = -1, col = size - 1, row = size - 1, wi = 0;
    const isFunc = (x, y) => {
      if (x < 9 && y < 9) return true;
      if (x >= size - 8 && y < 9) return true;
      if (x < 9 && y >= size - 8) return true;
      if (x === 6 || y === 6) return true;
      // alignment areas (rough check: covered by function zones near finders)
      if (version >= 2) {
        const positions = [];
        let step = version >= 7 ? 6 : (version >= 4 ? 5 : 4);
        for (let p = 8; p <= size - 9; p += step) positions.push(p);
        if (positions[positions.length - 1] !== size - 9) positions.push(size - 9);
        positions.unshift(6);
        for (const cy of positions) for (const cx of positions) {
          if ((cx === 6 && cy === 6) || (cx === 6 && cy === size - 7) || (cx === size - 7 && cy === 6)) continue;
          if (Math.abs(x - cx) <= 2 && Math.abs(y - cy) <= 2) return true;
        }
      }
      // format info zones
      if (y === 8 && x >= 0 && x < 9) return true;
      if (x === 8 && y >= 0 && y < 9) return true;
      if (y === 8 && x >= size - 8 && x < size) return true;
      if (x === 8 && y >= size - 8 && y < size) return true;
      return false;
    };
    let bitIdx = 0;
    const totalBits = words.length * 8;
    while (col > 0 || (col === 0 && row === size - 1 && false)) {
      if (col === 6) col--;
      for (let k = 0; k < 2; k++) {
        const x = col - k;
        if (x < 0) continue;
        if (!isFunc(x, row)) {
          let bit = 0;
          if (bitIdx < totalBits) {
            const word = words[Math.floor(bitIdx / 8)];
            bit = (word >> (7 - (bitIdx % 8))) & 1;
            bitIdx++;
          }
          // apply mask
          const mbits = [
            (row + x) % 2 === 0,
            row % 2 === 0,
            x % 3 === 0,
            (row + x) % 3 === 0,
            (Math.floor(row / 2) + Math.floor(x / 3)) % 2 === 0,
            ((row * x) % 2) + ((row * x) % 3) === 0,
            (((row * x) % 2) + ((row * x) % 3)) % 2 === 0,
            (((row + x) % 2) + ((row * x) % 3)) % 2 === 0
          ][mask];
          set(x, row, bit ^ (mbits ? 1 : 0));
        }
      }
      row += dir;
      if (row < 0 || row >= size) { dir = -dir; row += dir; col -= 2; }
      if (bitIdx >= totalBits && col <= 0) break;
    }
    // draw format info
    const drawFormat = (bits15) => {
      const bit = i => (bits15 >> i) & 1;
      // copy 1 (around top-left)
      for (let i = 0; i <= 5; i++) set(8, i, bit(i));
      set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (let i = 9; i <= 14; i++) set(14 - i, 8, bit(i));
      // copy 2 (split top-right + bottom-left)
      for (let i = 0; i <= 7; i++) set(size - 1 - i, 8, bit(i));
      for (let i = 8; i <= 14; i++) set(8, size - 15 + i, bit(i));
      set(8, size - 8, 1); // dark module
    };
    drawFormat(formatData);
    // version info (version >= 7) — we only support up to 10, but include for 7-10
    if (version >= 7) {
      const vBits = (() => {
        let rem = version << 12;
        for (let i = 17; i >= 12; i--) if ((rem >> i) & 1) rem ^= 0x1f25 << (i - 12);
        return (version << 12) | rem;
      })();
      const vb = i => (vBits >> i) & 1;
      for (let i = 0; i < 18; i++) {
        const a = Math.floor(i / 3), b = i % 3;
        set(size - 11 + b, a, vb(i));
        set(a, size - 11 + b, vb(i));
      }
    }
    return { size, m, mask };
  }

  function toSVG(text, opts = {}) {
    const sizePx = opts.size || 200;
    const ecl = (opts.ecl || 'M').toUpperCase();
    if (!CAP[1][ecl]) throw new Error('Bad ECC level');
    // pick best mask (try all 8, choose lowest penalty)
    const enc = encode(text, ecl);
    let best = null, bestPen = Infinity;
    for (let mask = 0; mask < 8; mask++) {
      const m = buildMatrix(enc.version, enc.words, ecl, mask);
      const pen = penalty(m);
      if (pen < bestPen) { bestPen = pen; best = m; }
    }
    const q = best;
    const n = q.size, cell = sizePx / (n + 8);
    let path = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      if (q.m[y][x]) path += `M${((x + 4) * cell).toFixed(2)} ${((y + 4) * cell).toFixed(2)}h${cell.toFixed(2)}v${cell.toFixed(2)}h${(-cell).toFixed(2)}z`;
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${sizePx} ${sizePx}" width="${sizePx}" height="${sizePx}" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${path}" fill="#000"/></svg>`;
  }

  function penalty(q) {
    const mat = q.m;
    const n = q.size;
    let pen = 0;
    // rule 1: runs of same color >= 5
    const runs = arr => {
      let p = 0, run = 1;
      for (let i = 1; i <= arr.length; i++) {
        if (i < arr.length && arr[i] === arr[i - 1]) run++;
        else { if (run >= 5) p += 3 + (run - 5); run = 1; }
      }
      return p;
    };
    for (let y = 0; y < n; y++) pen += runs(mat[y]);
    for (let x = 0; x < n; x++) { const col = []; for (let y = 0; y < n; y++) col.push(mat[y][x]); pen += runs(col); }
    // rule 2: 2x2 blocks
    for (let y = 0; y < n - 1; y++) for (let x = 0; x < n - 1; x++) {
      const v = mat[y][x];
      if (v === mat[y][x + 1] && v === mat[y + 1][x] && v === mat[y + 1][x + 1]) pen += 3;
    }
    // rule 3: finder-like patterns
    const pat1 = [1, 0, 1, 1, 1, 0, 1, 0, 0, 0, 0];
    for (let y = 0; y < n; y++) for (let x = 0; x <= n - 11; x++) {
      let ok = true;
      for (let k = 0; k < 11; k++) if (mat[y][x + k] !== pat1[k]) { ok = false; break; }
      if (ok) pen += 40;
      ok = true;
      for (let k = 0; k < 11; k++) if (mat[y][x + k] !== pat1[10 - k]) { ok = false; break; }
      if (ok) pen += 40;
    }
    // rule 4: dark ratio
    let dark = 0;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) dark += mat[y][x];
    const pct = dark / (n * n) * 100;
    pen += Math.floor(Math.abs(pct - 50) / 5) * 10;
    return pen;
  }

  return { encode, toSVG };
})();

   i18n — Hindi/English UI toggle (nav + common chrome)

function confirmDlg(title, message, okLabel = 'Confirm', danger = false) {
  return new Promise(resolve => {
    const root = $('#modalRoot');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
          <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close>✕</button></div>
          <div class="modal-body"><p style="margin:0;line-height:1.6">${esc(message)}</p></div>
          <div class="modal-foot">
            <button class="btn" data-cancel>Cancel</button>
            <button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(okLabel)}</button>
          </div>
        </div>
      </div>`;
    const close = val => { root.innerHTML = ''; resolve(val); };
    root.querySelector('[data-ok]').onclick = () => close(true);
    root.querySelector('[data-cancel]').onclick = () => close(false);
    root.querySelector('[data-close]').onclick = () => close(false);
  });
}

function promptDlg(title, label, defaultValue = '') {
  return new Promise(resolve => {
    const root = $('#modalRoot');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">

          </div>
          <div class="modal-foot">
            <button class="btn" data-cancel>Cancel</button>
            <button class="btn primary" data-ok>OK</button>
          </div>
        </div>
      </div>`;
    const close = val => { root.innerHTML = ''; resolve(val); };
    root.querySelector('[data-ok]').onclick = () => close($('#promptVal').value.trim());
    root.querySelector('[data-cancel]').onclick = () => close('');
    root.querySelector('[data-close]').onclick = () => close('');
    root.querySelector('#promptVal').addEventListener('keydown', e => { if (e.key === 'Enter') close($('#promptVal').value.trim()); });
    setTimeout(() => { const i = root.querySelector('#promptVal'); if (i) i.focus(); }, 50);
  });
}

function openModal(html, opts = {}) {
  const root = $('#modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal ${opts.wide ? 'wide' : ''}" role="dialog" aria-modal="true">
        ${html}
      </div>
    </div>`;
  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  // Attach ALL close/cancel buttons — not just the first one.
  // This fixes the Cancel button in every modal (head ✕ + foot Cancel).
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  root.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', close));
  root.querySelector('.modal-backdrop').addEventListener('click', e => { if (e.target === e.currentTarget && !opts.sticky) close(); });
  return { close, root };
}

function seedInventory(n = 260) {
  const rows = [];
  const used = new Set();
  for (let i = 0; i < n; i++) {
    let bc;
    do { bc = String(8900000000000 + Math.floor(Math.random() * 8999999999999)); } while (used.has(bc));
    used.add(bc);
    const brand = DEMO.brands[Math.floor(Math.random() * DEMO.brands.length)];
    const model = DEMO.models[Math.floor(Math.random() * DEMO.models.length)];
    const status = DEMO.statuses[Math.floor(Math.random() * DEMO.statuses.length)];
    const stockAge = Math.floor(Math.random() * 130);
    const modAge = Math.max(0, stockAge + Math.floor(Math.random() * 40) - 10);
    const ageBucket = stockAge < 30 ? 'Below 30' : stockAge < 60 ? '30-60' : stockAge < 75 ? '60-75' : 'Above 75';
    const priority = ageBucket === '60-75' ? 'P3' : ageBucket === 'Above 75' ? 'P4' : 'P2';
    const statusBucket = status === 'L4' || status === 'Marked L4' ? 'L4'
      : status === 'Pending Approval' ? 'Approval Pending'
      : status === 'Part Missing' ? 'Part Pending'
      : status === 'Bin Storage' ? 'Bin Storage' : status;
    const location = (status === 'Bin Storage' || Math.random() < 0.4) ? DEMO.locations[Math.floor(Math.random() * DEMO.locations.length)] : '';
    const binBucket = location ? 'BIN-' + String(Math.floor(parseInt(location.replace(/\D/g, '')) / 10) + 1).padStart(2, '0') : '';
    rows.push({
      BARCODE: bc, PRODUCT_NAME: model, MODEL: model, CATEGORY: DEMO.categories[Math.floor(Math.random() * DEMO.categories.length)],
      BRAND: brand, SOURCE: 'Daily Raw Data', MOD_AGE: modAge, STOCK_AGE: stockAge,
      AGE_BUCKET: ageBucket, PRIORITY: priority, STATUS: status, STATUS_BUCKET: statusBucket,
      LOCATION: location, BIN_BUCKET: binBucket,
      ENGINEER: DEMO.engineers[Math.floor(Math.random() * DEMO.engineers.length)],
      PROCESSING_DATE: nowISO().slice(0, 10), RUN_ID: 'RUN' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '_0000'
    });
  }
  return rows;
}

const ROLE_HIERARCHY = { VIEWER: 0, OPERATOR: 1, MANAGER: 2, ADMIN: 3, OWNER: 4 };
let currentUser = state.users.find(u => u.role === 'OWNER') || state.users[0];
function can(level) { return ROLE_HIERARCHY[currentUser.role] >= ROLE_HIERARCHY[level]; }
function roleGuard(level, msg = 'You do not have permission for this action.') {
  if (!can(level)) { toast(msg, 'err'); return false; }
  return true;
}

/* ────────────────────────── API ADAPTER ────────────────────────── */
/* Three modes:
   NATIVE — UI is served BY Apps Script (HtmlService). Calls go
            directly through google.script.run → Google Sheets.
            ZERO third-party services.
   LIVE   — static UI calling a deployed Apps Script Web App via fetch.
   DEMO   — in-browser simulation with seeded data. */
const NATIVE = (typeof google !== 'undefined' && google.script && google.script.run) ? true : false;
let msQueue = [];   // files queued from single-file Import screen (multi-select) → routed to Multi-Source
const api = {
  async call(action, params = {}) {
    if (NATIVE) {
      // Sanitize params before google.script.run — undefined/NaN/Date/function values
      // cause "Failed due to illegal value in property: 0" at the transfer boundary.
      let safe;
      try { safe = JSON.parse(JSON.stringify(params || {})); } catch (e) { safe = params || {}; }
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err => reject(new Error((err && err.message) ? err.message : String(err))))
          .runApi(action, safe);
      });
    }
    const url = state.settings.apiUrl;
    if (!url) throw new Error('Backend not connected. Set the Apps Script Web App URL in Settings, or use Demo mode.');
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, params, user: currentUser.email })
    });
    const text = await res.text();
    let data; try { data = JSON.parse(text); } catch (e) { throw new Error('Invalid backend response.'); }
    if (data && data.status === 'error') throw new Error(data.message || 'Backend error.');
    return data && data.data;
  },
  isLive() { return NATIVE || !!state.settings.apiUrl; },
  mode() { return NATIVE ? 'native' : (state.settings.apiUrl ? 'live' : 'demo'); },
  /* Pull real data from the backend into local state so every screen
     renders live data. Runs once at boot and after each process run. */
  async syncAll() {
    if (!api.isLive()) return false;
    try {
      const [inv, hist, errs, srcs, map, age, st, loc, reps, tpls] = await Promise.all([
        api.call('inventory.list', { page: 1, perPage: 100000 }),
        api.call('history.list'), api.call('errors.list'),
        api.call('sources.list'), api.call('mapping.list'),
        api.call('rules.age.list'), api.call('rules.status.list'),
        api.call('rules.location.list'), api.call('reports.list'),
        api.call('reports.templates.list')
      ]);
      if (inv && inv.rows && inv.headers) {
        state.inventory = inv.rows.map(r => {
          const o = {};
          inv.headers.forEach((h, i) => { o[h] = r[i]; });
          return o;
        });
      }
      if (hist && hist.data) state.history = hist.data.map(r => ({
        runId: r[0], date: String(r[1] || '').slice(0, 10), source: r[2],
        input: +r[3] || 0, processed: +r[4] || 0, errors: +r[6] || 0,
        duration: r[7], status: r[8]
      }));
      if (errs && errs.data) state.errors = errs.data.map(r => ({
        runId: r[0], row: +r[1] || 0, barcode: r[2] || '', source: r[3] || '',
        field: r[4] || '', error: r[5] || '', ts: String(r[6] || '').slice(0, 10)
      }));
      if (Array.isArray(srcs)) state.sources = srcs.map(s => ({
        id: s['Source ID'], name: s['Source Name'], type: s['Source Type'],
        role: s['Source Role'], sheet: s['Sheet Name'], sheetId: s['Sheet ID'] || '',
        joinKey: s['Join Key'], joinFields: s['Join Fields'], active: s['Active']
      }));
      if (Array.isArray(map)) state.fieldMapping = map.map(m => ({
        source: m['Source'], sourceColumn: m['Source Column'], target: m['Target Field'],
        required: m['Required'], active: m['Active'], order: +m['Output Order'] || 99
      }));
      if (Array.isArray(age)) state.ageRules = age.map(r => ({
        min: +r['Min Age'], max: +r['Max Age'], bucket: r['Bucket'],
        priority: r['Priority'], active: r['Active']
      }));
      if (Array.isArray(st)) state.statusRules = st.map(r => ({
        raw: r['Raw Status'], bucket: r['Standard Bucket'],
        marking: r['Marking'], active: r['Active']
      }));
      if (Array.isArray(loc)) state.locationRules = loc.map(r => ({
        pattern: r['Location Pattern'], bucket: r['Bucket'],
        condition: r['Condition'] || '', active: r['Active']
      }));
      if (Array.isArray(reps)) state.reports = reps.map((r, i) => ({
        id: r['Report Name'] || 'RPT' + (i + 1), name: r['Report Name'],
        type: r['Report Type'] || 'Daily', filterField: r['Filter Field'] || '',
        filterValue: r['Filter Value'] || '', columns: r['Report Columns'],
        output: r['Output'] || r['Output Format'] || 'PDF', recipients: r['Email To'] || r['Recipients'] || '',
        groupBy: r['Group By'] || '', headerText: r['Header Text'] || '',
        footerText: r['Footer Text'] || '', orientation: r['Orientation'] || 'Portrait',
        summary: r['Summary'] || 'OFF', schedule: r['Schedule'] || r['Report Type'] || 'Daily', active: r['Active']
      }));
      if (Array.isArray(tpls)) state.reportTemplates = tpls.map((t, i) => {
        let cfg = {};
        try { cfg = JSON.parse(t['Config JSON'] || '{}'); } catch (e) { cfg = {}; }
        return {
          id: t['Template Name'] || 'TPL' + (i + 1), name: t['Template Name'],
          config: cfg, active: t['Active'] || 'ON'
        };
      });
      // Advanced feature sync: alerts, trends, activity, settings
      const [alerts, trends, activity, sys] = await Promise.all([
        api.call('alerts.list'), api.call('trends.list'),
        api.call('activity.list'), api.call('settings.get')
      ]);
      if (Array.isArray(alerts)) state.alertRules = alerts.map((a, i) => ({
        id: a['Alert Name'] || 'ALT' + (i + 1), name: a['Alert Name'],
        filterField: a['Filter Field'] || 'BRAND', filterValue: a['Filter Value'] || '',
        operator: a['Operator'] || 'LT', threshold: +a['Threshold'] || 0,
        emailTo: a['Email To'] || '', telegram: a['Telegram'] === 'ON' ? 'ON' : 'OFF', active: a['Active']
      }));
      if (trends && trends.data) state.trends = trends.data.map(r => ({
        runId: r[0], date: String(r[1] || '').slice(0, 10), below30: +r[2] || 0, m30: +r[3] || 0,
        m60: +r[4] || 0, above75: +r[5] || 0, total: +r[6] || 0
      }));
      if (activity && activity.data) state.activity = activity.data.map(r => ({
        ts: String(r[0] || ''), user: r[1] || '', action: r[2] || '', object: r[3] || '', result: r[4] || 'OK'
      }));
      if (sys && typeof sys === 'object') state.systemSettings = Object.assign({}, state.systemSettings, sys);
      save();
      return true;
    } catch (e) {
      toast('Live data sync failed: ' + e.message, 'err');
      return false;
    }
  }
};

function buildNav() {
  const nav = $('#nav');
  nav.innerHTML = NAV
    .filter(n => ROLE_HIERARCHY[currentUser.role] >= ROLE_HIERARCHY[n.min])
    .map(n => `<a href="#/${n.id}" data-nav="${n.id}"><span class="ico">${n.ico}</span>${esc(T(n.id))}</a>`)
    .join('');
  // Apps Script iframe: block anchor default navigation,
  // otherwise every click reloads the top window (blank/black + loading).
  $$('#nav a').forEach(a => {
    a.addEventListener('click', ev => { ev.preventDefault(); navigate(a.dataset.nav); });
  });

function currentRoute() { return (location.hash.replace('#/', '') || 'dashboard').split('?')[0]; }
function navigate(route) { location.hash = '#/' + route; }

/* ── Global refresh: live mode fetches fresh data from backend, demo re-renders ── */
async function refreshAll() {
  const btn = (event && event.target) || null;
  const orig = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '⟳ Loading…'; }
  try {
    if (api.isLive()) {
      await api.syncAll();
      render();
      toast('Data refreshed from backend.', 'ok');
    } else {
      render();
      toast('Data refreshed.', 'ok');
    }
  } catch (e) {
    const msg = (e && e.message) ? e.message : String(e);
    toast('Refresh failed: ' + msg, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = orig; }
  }
}

function render() {
  buildNav();
  const route = currentRoute();
  const navItem = NAV.find(n => n.id === route);
  const allowed = navItem && ROLE_HIERARCHY[currentUser.role] >= ROLE_HIERARCHY[navItem.min];
  $('#pageTitle').textContent = navItem ? T(navItem.id) : 'Dashboard';
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.nav === route));
  $('#userName').textContent = currentUser.name;
  $('#userRole').textContent = currentUser.role;
  $('#userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
  const conn = $('#connBadge');
  conn.className = 'conn-badge ' + (api.isLive() ? 'live' : 'demo');
  $('#connLabel').textContent = api.mode() === 'native' ? 'LIVE — GOOGLE NATIVE' : api.isLive() ? 'LIVE — APPS SCRIPT' : 'DEMO MODE';
  const content = $('#content');
  if (state.backendError) {
    if (!content.querySelector('.err-strip')) {
      const strip = document.createElement('div');
      strip.className = 'err-strip';
      strip.innerHTML = '⚠️ <strong>Backend connection problem:</strong> ' + String(state.backendError).replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c])) + ' — showing <strong>demo data</strong> for now. Fix: re-run setupAutomationSystem(), authorize all permissions, deploy a new version, then refresh.';
      content.insertBefore(strip, content.firstChild);
    }
  } else {
    const old = content.querySelector('.err-strip');
    if (old) old.remove();
  }
  if (!allowed) { content.innerHTML = `<div class="empty-state"><div class="big">🔒</div><h2>Access restricted</h2><p>Your role (${esc(currentUser.role)}) does not allow this screen.</p></div>`; return; }
  SCREENS[route] ? SCREENS[route](content) : SCREENS.dashboard(content);
  $('#sidebar').classList.remove('open');
}

/* ────────────────────── SVG CHART HELPERS (no deps) ────────────────────── */
const CHART_COLORS = ['#3b82f6', '#22c55e', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#14b8a6'];

// Donut chart: data = [[label, value], ...]; returns SVG + legend
function svgDonut(data, size = 200) {
  const total = data.reduce((s, d) => s + d[1], 0);
  if (!total) return emptyState('📊', 'No data', 'Run the daily process to see charts.');
  const r = size / 2 - 12, cx = size / 2, cy = size / 2, stroke = 30;
  let acc = 0, segs = '';
  data.forEach((d, i) => {
    const frac = d[1] / total;
    const a1 = acc * 360 - 90, a2 = (acc + frac) * 360 - 90;
    const x1 = cx + r * Math.cos(a1 * Math.PI / 180), y1 = cy + r * Math.sin(a1 * Math.PI / 180);
    const x2 = cx + r * Math.cos(a2 * Math.PI / 180), y2 = cy + r * Math.sin(a2 * Math.PI / 180);
    const large = frac > 0.5 ? 1 : 0;
    segs += `<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${CHART_COLORS[i % CHART_COLORS.length]}" stroke-width="${stroke}" stroke-linecap="butt">
      <title>${esc(d[0])}: ${fmt(d[1])} (${Math.round(frac * 100)}%)</title></path>`;
    acc += frac;
  });
  return `<div class="chart-row">
    <svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Distribution chart">${segs}
      <text x="${cx}" y="${cy - 2}" text-anchor="middle" class="chart-center-n">${fmt(total)}</text>
      <text x="${cx}" y="${cy + 14}" text-anchor="middle" class="chart-center-l">items</text>
    </svg>
    <div class="chart-legend">${data.map((d, i) => `<div class="lg-item"><span class="lg-swatch" style="background:${CHART_COLORS[i % CHART_COLORS.length]}"></span><span class="lg-label">${esc(d[0])}</span><strong>${fmt(d[1])}</strong><span class="lg-pct">${Math.round(d[1] / total * 100)}%</span></div>`).join('')}</div>
  </div>`;
}

// Vertical bar chart: data = [[label, value], ...]
function svgBars(data, opts = {}) {
  const total = data.reduce((s, d) => s + d[1], 0);
  if (!total) return emptyState('📊', 'No data', 'Run the daily process to see charts.');
  const W = 520, H = 220, padB = 38, padT = 18, padL = 8, padR = 8;
  const max = Math.max(...data.map(d => d[1]));
  const n = Math.min(data.length, 12);
  const slice = data.slice(0, n);
  const bw = (W - padL - padR) / n;
  let bars = '', labels = '', vals = '';
  slice.forEach((d, i) => {
    const h = Math.max(2, (d[1] / max) * (H - padB - padT));
    const x = padL + i * bw + bw * 0.15;
    const y = H - padB - h;
    const color = CHART_COLORS[i % CHART_COLORS.length];
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}"><title>${esc(d[0])}: ${fmt(d[1])} (${Math.round(d[1] / total * 100)}%)</title></rect>`;
    vals += `<text x="${(x + bw * 0.35).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" class="chart-val">${fmt(d[1])}</text>`;
    labels += `<text x="${(x + bw * 0.35).toFixed(1)}" y="${(H - 12).toFixed(1)}" text-anchor="middle" class="chart-lbl">${esc(String(d[0]).slice(0, 12))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="${esc(opts.title || 'Bar chart')}">${bars}${vals}${labels}</svg>`;
}

// Horizontal bar list (top-N): data = [[label, value], ...]
function hbarList(data, limit = 8) {
  const total = data.reduce((s, d) => s + d[1], 0);
  if (!total) return emptyState('📊', 'No data', 'Run the daily process to see charts.');
  const max = Math.max(...data.map(d => d[1]));
  return data.slice(0, limit).map((d, i) => {
    const pct = Math.round(d[1] / max * 100);
    return `<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>${esc(d[0])}</span><strong>${fmt(d[1])}</strong></div><div class="progress"><div style="width:${pct}%;background:${CHART_COLORS[i % CHART_COLORS.length]}"></div></div></div>`;
  }).join('');
}

function sourceModal(src) {

    <div class="modal-head"><h3>${src ? 'Edit Source' : 'Add Source'}</h3><button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div><label>Source Name</label><input type="text" id="fName" value="${esc(src?.name || '')}" placeholder="e.g. Daily Raw Data"></div>
        <div><label>Source Type</label><select id="fType">${['Google Sheet','Excel Import','CSV'].map(t => `<option ${src?.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div><label>Source Role</label><select id="fRole">${['PRIMARY','JOIN'].map(r => `<option ${src?.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
        <div><label>Active</label><select id="fActive">${['ON','OFF'].map(v => `<option ${src?.active === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <div><label>Sheet Name</label><input type="text" id="fSheet" value="${esc(src?.sheet || '')}" placeholder="Sheet name in spreadsheet"></div>
        <div><label>Sheet ID (external, optional)</label><input type="text" id="fSheetId" value="${esc(src?.sheetId || '')}" placeholder="Google Sheet ID or URL"></div>
        <div><label>Join Key</label><input type="text" id="fJoinKey" value="${esc(src?.joinKey || 'BARCODE')}"></div>
        <div><label>Join Fields (comma-separated)</label><input type="text" id="fJoinFields" value="${esc(src?.joinFields || '')}" placeholder="Stock Age,Status,Model"></div>
      </div>
      <p class="hint">Role PRIMARY = main raw dataset · Role JOIN = lookup source (QC Stock, Location).</p>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="fSave">Save Source</button>
    </div>`, {});
  m.root.querySelector('[data-close]').onclick = m.close;
  $('#fSave').onclick = () => {
    const data = { name: $('#fName').value.trim(), type: $('#fType').value, role: $('#fRole').value, active: $('#fActive').value, sheet: $('#fSheet').value.trim(), sheetId: $('#fSheetId').value.trim(), joinKey: $('#fJoinKey').value.trim() || 'BARCODE', joinFields: $('#fJoinFields').value.trim() };
    if (!data.name) { toast('Source name is required.', 'err'); return; }
    if (src) Object.assign(src, data);
    else state.sources.push({ id: 'SRC' + String(state.sources.length + 1).padStart(3, '0'), ...data });
    save(); m.close(); render(); toast('Source saved.', 'ok');
  };
}
