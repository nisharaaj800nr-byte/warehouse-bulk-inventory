services:
  bulk-repair:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      DB_PATH: /data/bulkrepair.db
      SESSION_TTL_HOURS: 168
    volumes:
      - bulkrepair-data:/data
    restart: unless-stopped

volumes:
  bulkrepair-data:
